[package]
name = "citizen-signer"
description = "CitizenSDK唯一sr25519实现，经安全ChainSigner合同供Core使用。"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# Core和唯一C ABI通过安全ChainSigner合同链接本库。
[lib]
crate-type = ["rlib"]

[dependencies]
# 唯一真实实现直接履行产品无关 ChainSigner/SecretBuffer 合同；硬件金库仍是独立合同。
citizen-sdk-contracts = { path = "../types" }
# 按原锁使用同一schnorrkel版本，不在平台绑定复制密码学实现。
schnorrkel = { version = "=0.11.5", default-features = false, features = [
    "preaudit_deprecated",
    "alloc",
    "getrandom",
] }
# 私钥材料作用域结束即擦除，禁止手写清零（会被编译器优化掉）。
zeroize = "=1.9.0"
