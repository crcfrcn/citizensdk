[package]
name = "citizensdk"
description = "CitizenSDK唯一Rust实现与公开C接口。"
version = "2.0.0"
edition = "2021"
authors = ["VoyagerRhett <chinanation@icloud.com>"]
repository = "https://github.com/crcfrcn/citizensdk"
homepage = "https://github.com/crcfrcn/citizensdk"
license = "MIT"
publish = false
autotests = false

[lib]
name = "citizensdk"
path = "core/src/lib.rs"
crate-type = ["rlib"]

[features]
default = ["wallet", "signing", "chain", "transactions", "history", "qr"]
wallet = ["signing"]
signing = []
transactions = ["chain"]
history = ["chain"]
qr = []
chain = ["dep:blake2-rfc", "dep:bytes", "dep:hex", "dep:http", "dep:http-body-util", "dep:hyper-rustls", "dep:hyper-util", "dep:parking_lot", "dep:rustls", "dep:smoldot-light", "dep:subxt-core", "dep:tokio", "dep:url"]

[dependencies]
aes = { version = "=0.8.4", features = ["zeroize"] }
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
base64 = { version = "=0.22.1" }
bip39 = { version = "=2.2.2", default-features = false, features = ["std", "zeroize"] }
blake2 = { version = "=0.10.6" }
blake2-rfc = { version = "=0.2.18", optional = true }
bs58 = { version = "=0.5.1", default-features = false, features = ["alloc"] }
bytes = { version = "=1.12.1", optional = true }
futures = { version = "=0.3.34" }
futures-channel = { version = "=0.3.34" }
futures-core = { version = "=0.3.34" }
futures-executor = { version = "=0.3.34" }
futures-util = { version = "=0.3.34" }
getrandom = { version = "=0.3.4" }
ghash = { version = "=0.5.1", features = ["zeroize"] }
hex = { version = "=0.4.3", optional = true }
hmac = { version = "=0.12.1" }
http = { version = "=1.5.0", optional = true }
http-body-util = { version = "=0.1.5", optional = true }
hyper-rustls = { version = "=0.27.9", default-features = false, features = ["http1", "ring", "rustls-platform-verifier", "tls12"], optional = true }
hyper-util = { version = "=0.1.20", default-features = false, features = ["client-legacy", "http1", "tokio"], optional = true }
parking_lot = { version = "=0.12.5", optional = true }
pbkdf2 = { version = "=0.12.2" }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"], optional = true }
schnorrkel = { version = "=0.11.5", default-features = false, features = ["preaudit_deprecated", "alloc", "getrandom"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151" }
sha2 = { version = "=0.10.9" }
smoldot-light = { path = "smoldot/light-base", default-features = false, features = ["std"], optional = true }
subxt-core = { version = "=0.43.0", default-features = true, optional = true }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "sync", "time", "net"], optional = true }
unicode-normalization = { version = "=0.1.25" }
unicode-segmentation = { version = "=1.13.3" }
url = { version = "=2.5.8", optional = true }
zeroize = { version = "=1.9.0" }

[target."cfg(target_os = \"android\")".dependencies]
jni = "=0.22.4"
rustls-platform-verifier = "=0.7.0"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

