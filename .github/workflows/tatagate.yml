name: tatagate

# 中文说明：main推送只运行本仓同SHA门禁；具名功能结果、注释、文档及回归全部由本仓核验。
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tatagate-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: 检出准确推送提交
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 登记Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - name: 本仓资源准备与完整塔塔门禁
        shell: node {0}
        run: |
          const child = require('node:child_process');
          child.execFileSync(process.execPath, ['.github/tatagate/index.mjs', 'remote'], {stdio:'inherit'});
