name: tatagate

# 中文说明：main代码推送独立触发本仓塔塔门禁；CI和Release仍保持自己的手动流程。
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tatagate-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 检出准确推送提交
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 登记Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - name: 准备本仓正式Git、GNU工具与Workflow检查器
        shell: node {0}
        run: |
          // 首次构建只读取合同登记的官方Ubuntu输入，失败不使用系统工具执行正常门禁。
          const fs = require('node:fs'), path = require('node:path'), child = require('node:child_process');
          if (process.version !== 'v25.2.1') throw Error('Node版本不符');
          const parent = fs.realpathSync(process.env.RUNNER_TEMP);
          if (parent !== '/home/runner/work/_temp') throw Error('Runner临时根身份不符');
          const work = path.join(parent, 'citizensdk-tools');
          fs.mkdirSync(work, {recursive:false});
          child.execFileSync(process.execPath, ['.github/tatagate/tools.mjs', 'prepare-runner', '--bootstrap', work], {stdio:'inherit'});
      - name: 本仓完整塔塔门禁
        shell: node {0}
        run: |
          const child = require('node:child_process');
          child.execFileSync(process.execPath, ['.github/tatagate/index.mjs', 'remote'], {stdio:'inherit'});
