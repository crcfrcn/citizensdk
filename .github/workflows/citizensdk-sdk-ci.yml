        name: "${{ steps.citizensdk_ci_identity.outputs.artifact }}"
        path: "${{ steps.citizensdk_ci_identity.outputs.root }}/native.tgz"
        if-no-files-found: error
        overwrite: false
        retention-days: 7
    - if: "${{ failure() && !cancelled() && steps.citizensdk_ci_cache.outcome == 'success' }}"
      env:
        CI_CACHE_TERMINAL_STATE: failure
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/ci/sdk.mjs" android workflow-step 10
    - if: "${{ failure() && !cancelled() && steps.citizensdk_ci_cache.outcome == 'success' }}"
      name: 保存本次失败的CI增量缓存
      id: citizensdk_ci_cache_save_failure
      continue-on-error: true
      uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: "${{ steps.citizensdk_ci_cache.outputs.failure_paths }}"
        key: "${{ steps.citizensdk_ci_cache.outputs.failure_key }}"
    - if: "${{ failure() && !cancelled() && steps.citizensdk_ci_cache_save_failure.outcome == 'success' }}"
      continue-on-error: true
      env:
        GH_TOKEN: "${{ github.token }}"
        CI_CACHE_TERMINAL_STATE: failure
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/ci/sdk.mjs" android workflow-step 11
    - if: "${{ success() }}"
      env:
        CI_CACHE_TERMINAL_STATE: success
