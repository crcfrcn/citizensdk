      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/ci/sdk.mjs" android workflow-step 9
    - if: "${{ success() }}"
      name: 保存当前 run 的阶段0原生件
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
