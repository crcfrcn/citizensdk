# citizensdk.sdk.release 的独立 GitHub 工作流。
name: citizensdk.sdk.release
# 远端标题只展示产品、平台、流程；内部 pipeline 仍承担唯一机器身份。
run-name: "${{ inputs.run_title }}"
'on':
  workflow_dispatch:
    inputs:
      pipeline:
        required: true
        type: string
      run_title:
        required: true
        type: string
      source_sha:
        required: false
        type: string
      ci_run_id:
        required: false
        type: string
      version_tag:
        required: false
        type: string
      software_version:
        required: false
        type: string
      spec_version:
        required: false
        type: string
      chain_spec_version:
        required: false
        type: string
      genesis_hash:
        required: false
        type: string
      finalized_head:
        required: false
        type: string
concurrency:
  group: citizensdk.sdk.release
  cancel-in-progress: false
jobs:
  stage_1:
    name: CitizenSDK 全量构建 Android
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      CARGO_INCREMENTAL: '0'
      GH_TOKEN: "${{ github.token }}"
      CITIZENSDK_SOURCE_SHA: "${{ inputs.source_sha }}"
      CITIZENSDK_CI_RUN_ID: "${{ inputs.ci_run_id }}"
      CITIZENSDK_VERSION_TAG: "${{ inputs.version_tag }}"
      CITIZENSDK_SOFTWARE_VERSION: "${{ inputs.software_version }}"
      CITIZENSDK_SPEC_VERSION: "${{ inputs.spec_version }}"
      CITIZENSDK_CHAIN_SPEC_VERSION: "${{ inputs.chain_spec_version }}"
      CITIZENSDK_CHAIN_GENESIS_HASH: "${{ inputs.genesis_hash }}"
      CITIZENSDK_CHAIN_FINALIZED_HEAD: "${{ inputs.finalized_head }}"
      PRODUCT_EXPECTED_RUNNER_ARCH: X64
      PRODUCT_PLATFORM: Android
      SOURCE_SHA: "${{ inputs.source_sha }}"
      CI_RUN_ID: "${{ inputs.ci_run_id }}"
      VERSION_TAG: "${{ inputs.version_tag }}"
      SOFTWARE_VERSION: "${{ inputs.software_version }}"
      SPEC_VERSION: "${{ inputs.spec_version }}"
      CHAIN_SPEC_VERSION: "${{ inputs.chain_spec_version }}"
      GENESIS_HASH: "${{ inputs.genesis_hash }}"
      FINALIZED_HEAD: "${{ inputs.finalized_head }}"
    steps:
    - shell: bash
      env:
        PIPELINE: "${{ inputs.pipeline }}"
        RUN_TITLE: "${{ inputs.run_title }}"
        SOURCE_SHA: "${{ inputs.source_sha }}"
        CI_RUN_ID: "${{ inputs.ci_run_id }}"
        VERSION_TAG: "${{ inputs.version_tag }}"
        SOFTWARE_VERSION: "${{ inputs.software_version }}"
        SPEC_VERSION: "${{ inputs.spec_version }}"
        CHAIN_SPEC_VERSION: "${{ inputs.chain_spec_version }}"
        GENESIS_HASH: "${{ inputs.genesis_hash }}"
        FINALIZED_HEAD: "${{ inputs.finalized_head }}"
      run: |-
        node --input-type=module <<'NODE'
        const e=process.env,allowed=new Set(["citizensdk.sdk.release"]);
        if(!allowed.has(e.PIPELINE||''))throw Error('产品流程身份无效');
        if(e.RUN_TITLE!=="公民SDK · SDK · Release")throw Error('产品平台流程展示标题无效');
        if(!/^[0-9a-f]{40}$/.test(e.SOURCE_SHA||'')||!/^[1-9][0-9]*$/.test(e.CI_RUN_ID||'')||!e.VERSION_TAG)throw Error('Release来源输入无效');
        if(!e.SOFTWARE_VERSION||[e.SPEC_VERSION,e.CHAIN_SPEC_VERSION,e.GENESIS_HASH,e.FINALIZED_HEAD].some(Boolean))throw Error('软件Release输入无效');
        NODE
    - name: 检出准确产品源码
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ inputs.source_sha }}"
        fetch-depth: 0
        persist-credentials: false
    - name: 装载准确Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 25.2.1
    - shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/release/android/execute.mjs" workflow-step 0
    - env:
        GH_TOKEN: "${{ github.token }}"
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/release/android/execute.mjs" workflow-step 1
    - id: citizensdk_ci_identity
      env:
        CITIZENSDK_JOB: citizensdk_release_sdk__android
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/release/android/execute.mjs" workflow-step 2
    - shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/release/android/execute.mjs" workflow-step 3
    - shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/release/android/execute.mjs" workflow-step 4
    - shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/release/android/execute.mjs" workflow-step 5
    - shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/release/android/execute.mjs" workflow-step 6
    - shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/release/android/execute.mjs" workflow-step 7
    - if: "${{ success() }}"
      env:
        CITIZENSDK_JOB: citizensdk_release_sdk__android
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/release/android/execute.mjs" workflow-step 8
    - if: "${{ success() }}"
      name: 保存当前 run 的阶段0原生件
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: "${{ steps.citizensdk_ci_identity.outputs.artifact }}"
        path: "${{ steps.citizensdk_ci_identity.outputs.root }}/native.tgz"
        if-no-files-found: error
        overwrite: false
        retention-days: 7
