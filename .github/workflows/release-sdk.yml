  stage_5:
    name: CitizenSDK 全量构建 Windows
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: false
      CARGO_TERM_COLOR: always
