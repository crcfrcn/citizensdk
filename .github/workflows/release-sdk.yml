      CITIZENSDK_VERSION_TAG: "${{ needs.prepare.outputs.tag }}"
      CITIZENSDK_SOFTWARE_VERSION: "${{ needs.prepare.outputs.version }}"
      PRODUCT_EXPECTED_RUNNER_ARCH: X64
      PRODUCT_PLATFORM: Android
      SOURCE_SHA: "${{ github.sha }}"
      VERSION_TAG: "${{ needs.prepare.outputs.tag }}"
      SOFTWARE_VERSION: "${{ needs.prepare.outputs.version }}"
      RELEASE_VERSION: "${{ needs.prepare.outputs.version }}"
      RELEASE_TAG: "${{ needs.prepare.outputs.tag }}"
      PRODUCER_RUN_ID: "${{ github.run_id }}"
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ github.sha }}"
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 25.2.1
    - name: 准备本目标独占现场
      run: node .github/workflows/release-sdk.mjs job
    - shell: bash
      run: node "$GITHUB_WORKSPACE/.github/workflows/release-sdk.mjs" step 49
    - id: citizensdk_build_identity
      env:
        CITIZENSDK_JOB: consume_android
      shell: bash
      run: node "$GITHUB_WORKSPACE/.github/workflows/release-sdk.mjs" step 50
    - shell: bash
