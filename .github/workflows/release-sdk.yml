        path: "${{ env.CITIZENSDK_WORK_DIR }}/input/android"
    - name: 下载同次 apple 原生分片
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: citizensdk-${{ github.run_id }}-${{ github.run_attempt }}-apple-${{ env.CITIZENSDK_SOURCE_SHA }}-${{
