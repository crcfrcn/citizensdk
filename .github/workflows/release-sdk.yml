  stage_6:
    name: CitizenSDK 同源汇总
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    needs:
    - prepare
    - stage_1
    - stage_2
    - stage_3
    - stage_4
    - stage_5
    env:
