      RUST_BACKTRACE: '1'
      CARGO_INCREMENTAL: '0'
      GH_TOKEN: "${{ github.token }}"
      CITIZENSDK_SOURCE_SHA: "${{ github.sha }}"
      CITIZENSDK_VERSION_TAG: "${{ needs.prepare.outputs.tag }}"
      CITIZENSDK_SOFTWARE_VERSION: "${{ needs.prepare.outputs.version }}"
      PRODUCT_EXPECTED_RUNNER_ARCH: ARM64
      PRODUCT_PLATFORM: LinuxARM
      SOURCE_SHA: "${{ github.sha }}"
      VERSION_TAG: "${{ needs.prepare.outputs.tag }}"
      SOFTWARE_VERSION: "${{ needs.prepare.outputs.version }}"
