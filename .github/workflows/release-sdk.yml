    - shell: bash
      run: node "$GITHUB_WORKSPACE/.github/workflows/release-sdk.mjs" step 45
    - shell: bash
      run: node "$GITHUB_WORKSPACE/.github/workflows/release-sdk.mjs" step 46
    - shell: bash
      run: node "$GITHUB_WORKSPACE/.github/workflows/release-sdk.mjs" step 47
    - name: 下载同次 android 原生分片
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: citizensdk-${{ github.run_id }}-${{ github.run_attempt }}-android-${{ env.CITIZENSDK_SOURCE_SHA }}-${{
