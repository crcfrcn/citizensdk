      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: "${{ steps.citizensdk_build_identity.outputs.artifact }}"
        path: "${{ steps.citizensdk_build_identity.outputs.root }}/native.tgz"
