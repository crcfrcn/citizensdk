    - id: citizensdk_build_identity
      env:
        CITIZENSDK_JOB: linuxarm
      shell: bash
      run: node "$GITHUB_WORKSPACE/.github/workflows/release-sdk.mjs" step 18
    - shell: bash
      run: node "$GITHUB_WORKSPACE/.github/workflows/release-sdk.mjs" step 19
    - shell: bash
      run: node "$GITHUB_WORKSPACE/.github/workflows/release-sdk.mjs" step 20
    - shell: bash
      run: node "$GITHUB_WORKSPACE/.github/workflows/release-sdk.mjs" step 21
    - shell: bash
      run: node "$GITHUB_WORKSPACE/.github/workflows/release-sdk.mjs" step 22
    - shell: bash
      run: node "$GITHUB_WORKSPACE/.github/workflows/release-sdk.mjs" step 23
    - if: "${{ success() }}"
      env:
        CITIZENSDK_JOB: linuxarm
      shell: bash
      run: node "$GITHUB_WORKSPACE/.github/workflows/release-sdk.mjs" step 24
    - if: "${{ success() }}"
