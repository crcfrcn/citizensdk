        CITIZENSDK_JOB: linuxamd
      shell: bash
      run: node "$GITHUB_WORKSPACE/.github/workflows/release-sdk.mjs" step 33
    - if: "${{ success() }}"
      name: 保存当前 run 的阶段0原生件
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: "${{ steps.citizensdk_build_identity.outputs.artifact }}"
        path: "${{ steps.citizensdk_build_identity.outputs.root }}/native.tgz"
        if-no-files-found: error
        overwrite: false
        retention-days: 7
    - if: "${{ always() && steps.citizensdk_build_identity.outcome == 'success' }}"
      shell: bash
      run: node "$GITHUB_WORKSPACE/.github/workflows/release-sdk.mjs" step 34
