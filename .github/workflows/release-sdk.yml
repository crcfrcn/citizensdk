      run: node "$GITHUB_WORKSPACE/.github/workflows/release-sdk.mjs" step 28
    - shell: bash
      run: node "$GITHUB_WORKSPACE/.github/workflows/release-sdk.mjs" step 29
    - shell: bash
      run: node "$GITHUB_WORKSPACE/.github/workflows/release-sdk.mjs" step 30
    - shell: bash
      run: node "$GITHUB_WORKSPACE/.github/workflows/release-sdk.mjs" step 31
    - shell: bash
      run: node "$GITHUB_WORKSPACE/.github/workflows/release-sdk.mjs" step 32
    - if: "${{ success() }}"
