# SDK唯一公开平台；四宿主内部传递原生件，完整组包后在同一Run正式交付。
name: 公民SDK·SDK
run-name: 公民SDK·SDK·${{ github.run_number }}
'on':
  workflow_dispatch:
    inputs:
      publish:
        description: '正式发布及远端清理须独立授权'
        type: boolean
        required: false
        default: false
concurrency:
  group: ${{ github.repository }}-sdk
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
env:
  SOURCE_SHA: ${{ github.sha }}
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
jobs:
  select:
    name: 公民SDK·SDK·版本
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: tools
        name: 读取工具声明
        run: |
          printf 'node=%s\n' "$(sed -n "s/.*node:'\([^']*\)'.*/\1/p" scripts/config.mjs)" >> "$GITHUB_OUTPUT"
      # 保存官方Node版本目录及其完成标记，供每个新Runner直接恢复。
      - &nodecache
        id: nodecache
        name: 恢复官方Node缓存
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.tool_cache }}/node/${{ steps.tools.outputs.node }}
          key: sdk-node-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.node }}
      - &node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ steps.tools.outputs.node }}
          check-latest: false
      # 工具准备成功即保存；后续编译失败不应丢失已经准备好的Node。
      - &nodesave
        if: ${{ steps.nodecache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.tool_cache }}/node/${{ steps.tools.outputs.node }}
          key: ${{ steps.nodecache.outputs.cache-primary-key }}
      - id: version
        name: 计算本次交付版本
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/sdk.yml/runs?branch=main&event=workflow_dispatch&status=success&per_page=1" > "$RUNNER_TEMP/runs.json"
          node --input-type=module >> "$GITHUB_OUTPUT" <<'NODE'
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const previous=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/runs.json','utf8')).workflow_runs[0];
          let version=/^version: (\S+)$/mu.exec(readFileSync('pubspec.yaml','utf8'))[1];
          if(previous){
            const data=JSON.parse(execFileSync('gh',['api','repos/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+previous.id+'/artifacts?per_page=100'],{encoding:'utf8'}));
            const artifact=data.artifacts.find(value=>/^公民SDK·SDK·v\d+\.\d+\.\d+$/u.test(value.name));
            const next=artifact.name.slice('公民SDK·SDK·v'.length).split('.').map(BigInt);
            next[2]++;
            // 新主版本以源码声明为下限；同版交付继续递增补丁。
            const declared=version.split('.').map(BigInt);
            for(let i=0;i<3;i++){
              if(next[i]===declared[i])continue;
              if(next[i]>declared[i])version=next.join('.');
              break;
            }
          }
          console.log('version='+version);
          NODE
  android:
    needs: select
    name: 公民SDK·SDK·v${{ needs.select.outputs.version }}
    env:
      SDK_VERSION: ${{ needs.select.outputs.version }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - &tools
        id: tools
        name: 读取本产品工具声明
        run: |
          for name in node rust flutter ndk gradle cmake; do
            value="$(sed -n "s/.*$name:'\([^']*\)'.*/\1/p" scripts/config.mjs)"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_OUTPUT"
          done
          for name in sqlite openssl tpm2-tss zxing; do
            value="$(sed -n "s/^\"$name\":{.*\"version\": \"\([^\"]*\)\".*/\1/p" scripts/config.mjs)"
            printf '%s=%s\n' "${name//-/_}" "$value" >> "$GITHUB_OUTPUT"
          done
      - &cache
        id: cache
        name: 恢复官方增量缓存
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        timeout-minutes: 10
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/cache/rust
            target/cache/gradle-home
            target/cache/pub
            target/cache/flutter
            target/cache/sources
            target/cache/native
            target/cache/cmake
            target/cache/gradle
          key: sdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.rust }}-${{ steps.tools.outputs.flutter }}-${{ steps.tools.outputs.ndk }}-${{ steps.tools.outputs.node }}-${{ steps.tools.outputs.gradle }}-${{ steps.tools.outputs.cmake }}-${{ steps.tools.outputs.sqlite }}-${{ steps.tools.outputs.openssl }}-${{ steps.tools.outputs.tpm2_tss }}-${{ steps.tools.outputs.zxing }}-${{ hashFiles('Cargo.lock', 'pubspec.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.rust }}-${{ steps.tools.outputs.flutter }}-${{ steps.tools.outputs.ndk }}-${{ steps.tools.outputs.node }}-${{ steps.tools.outputs.gradle }}-${{ steps.tools.outputs.cmake }}-${{ steps.tools.outputs.sqlite }}-${{ steps.tools.outputs.openssl }}-${{ steps.tools.outputs.tpm2_tss }}-${{ steps.tools.outputs.zxing }}-${{ hashFiles('Cargo.lock', 'pubspec.lock') }}-
            sdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.rust }}-${{ steps.tools.outputs.flutter }}-${{ steps.tools.outputs.ndk }}-${{ steps.tools.outputs.node }}-${{ steps.tools.outputs.gradle }}-${{ steps.tools.outputs.cmake }}-${{ steps.tools.outputs.sqlite }}-${{ steps.tools.outputs.openssl }}-${{ steps.tools.outputs.tpm2_tss }}-${{ steps.tools.outputs.zxing }}-
            sdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.rust }}-${{ steps.tools.outputs.flutter }}-${{ steps.tools.outputs.ndk }}-
          fail-on-cache-miss: false
      - *nodecache
      - *node
      - *nodesave
      - &rust
        id: rust
        name: 准备官方Rust与二维码源码
        env:
          PRODUCT_RUST: ${{ steps.tools.outputs.rust }}
        run: |
          set -euo pipefail
          tool_cache="$GITHUB_WORKSPACE/target/cache/native/tools"
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          rust_home="${RUSTUP_HOME:-$HOME/.rustup}"
          if [ "$RUNNER_OS" = Windows ]; then tool_cache="$(cygpath -u "$tool_cache")"; cargo_home="$(cygpath -u "$cargo_home")"; rust_home="$(cygpath -u "$rust_home")"; fi
          mkdir -p "$tool_cache/bin" "$tool_cache/rustup/toolchains" "$tool_cache/rustup/update-hashes" "$cargo_home/bin"
          for binary in "$tool_cache/bin/"*; do
            if [ -f "$binary" ] && [ ! -e "$cargo_home/bin/$(basename "$binary")" ] && [ ! -L "$cargo_home/bin/$(basename "$binary")" ]; then cp -p "$binary" "$cargo_home/bin/"; fi
          done
          # 沿用已有的准确版本目录；仅将其放入原缓存范围，不探测或升级工具版本。
          for chain in "$rust_home/toolchains/$PRODUCT_RUST-"*; do
            if [ -d "$chain" ] && [ ! -d "$tool_cache/rustup/toolchains/$(basename "$chain")" ]; then
              cp -Rp "$chain" "$tool_cache/rustup/toolchains/"
              if [ -f "$rust_home/update-hashes/$(basename "$chain")" ]; then cp -p "$rust_home/update-hashes/$(basename "$chain")" "$tool_cache/rustup/update-hashes/"; fi
            fi
          done
          export PATH="$cargo_home/bin:$PATH"
          export RUSTUP_HOME="$tool_cache/rustup"
          if [ "$RUNNER_OS" = Windows ]; then export RUSTUP_HOME="$(cygpath -m "$RUSTUP_HOME")"; fi
          printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s/target/cache/rust\nGRADLE_USER_HOME=%s/target/cache/gradle-home\n' "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          cargo_bin="$cargo_home/bin"
          if [ "$RUNNER_OS" = Windows ]; then cargo_bin="$(cygpath -m "$cargo_bin")"; fi
          printf '%s\n' "$cargo_bin" >> "$GITHUB_PATH"
          if ! command -v rustup >/dev/null; then
            curl --fail --location --proto '=https' --tlsv1.2 https://sh.rustup.rs -o "$RUNNER_TEMP/rustup.sh"
            sh "$RUNNER_TEMP/rustup.sh" -y --profile minimal --default-toolchain none --no-modify-path
          fi
          rustup toolchain install "$PRODUCT_RUST" --profile minimal --no-self-update
          for name in rustup cargo rustc rustdoc; do cp -p "$(command -v "$name")" "$tool_cache/bin/"; done
          mkdir -p target/cache/sources
          node --input-type=module -e 'import {nativeSources} from "./scripts/config.mjs";for(const [name,value] of Object.entries(nativeSources))console.log([name,value.url,value.archive_root].join(" "))' > "$RUNNER_TEMP/native-sources.txt"
          while read -r source url directory; do
            case "$RUNNER_OS-$RUNNER_ARCH-$source" in *-zxing|Linux-ARM64-*|Windows-X64-sqlite) ;; *) continue ;; esac
            if [ ! -d "target/cache/sources/$directory" ]; then
              case "$url" in *.zip) archive="$RUNNER_TEMP/$source.zip" ;; *) archive="$RUNNER_TEMP/$source.tar.gz" ;; esac
              curl --fail --location --proto '=https' --tlsv1.2 "$url" -o "$archive"
              case "$archive" in *.zip) unzip -q "$archive" -d target/cache/sources ;; *) if [ "$RUNNER_OS" = Windows ]; then tar --force-local -xzf "$archive" -C target/cache/sources; else tar -xzf "$archive" -C target/cache/sources; fi ;; esac
              # 原生源缺失或换版时只重建原生依赖，保留工具及Cargo增量产物。
              case "$source" in sqlite|openssl|tpm2-tss) rm -rf target/cache/native/lib target/cache/native/include ;; esac
              for old in target/cache/sources/"${directory%-*}"-*; do
                if [ "$old" != "target/cache/sources/$directory" ]; then rm -rf "$old"; fi
              done
            fi
          done < "$RUNNER_TEMP/native-sources.txt"
          printf 'CITIZENSDK_ZXING_SOURCE_DIR=%s/target/cache/sources/zxing-cpp-3.1.1\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: 准备官方Flutter Android embedding
        env:
          PRODUCT_FLUTTER: ${{ steps.tools.outputs.flutter }}
        run: |
          if [ ! -x target/cache/flutter/bin/flutter ]; then git clone --depth 1 --branch "$PRODUCT_FLUTTER" https://github.com/flutter/flutter.git target/cache/flutter; fi
          "$GITHUB_WORKSPACE/target/cache/flutter/bin/flutter" precache --android
          printf 'FLUTTER_ROOT=%s/target/cache/flutter\nPUB_CACHE=%s/target/cache/pub\n' "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: 准备官方Android和Gradle
        id: android
        env:
          PRODUCT_NDK: ${{ steps.tools.outputs.ndk }}
          PRODUCT_CMAKE: ${{ steps.tools.outputs.cmake }}
          PRODUCT_GRADLE: ${{ steps.tools.outputs.gradle }}
        run: |
          mkdir -p target/cache/native/tools/android
          for component in "ndk/$PRODUCT_NDK" "cmake/$PRODUCT_CMAKE" platforms/android-36; do
            if [ ! -d "$ANDROID_HOME/$component" ] && [ -d "target/cache/native/tools/android/$component" ]; then
              mkdir -p "$ANDROID_HOME/${component%/*}"
              cp -Rp "target/cache/native/tools/android/$component" "$ANDROID_HOME/${component%/*}/"
            fi
          done
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$PRODUCT_NDK" "cmake;$PRODUCT_CMAKE" "platforms;android-36"
          printf 'ANDROID_NDK_HOME=%s/ndk/%s\n' "$ANDROID_HOME" "$PRODUCT_NDK" >> "$GITHUB_ENV"
          if [ ! -d "target/cache/gradle/gradle-$PRODUCT_GRADLE" ]; then
            curl --fail --location --proto '=https' --tlsv1.2 "https://services.gradle.org/distributions/gradle-$PRODUCT_GRADLE-bin.zip" -o "$RUNNER_TEMP/gradle.zip"
            mkdir -p target/cache/gradle
            unzip -q "$RUNNER_TEMP/gradle.zip" -d target/cache/gradle
          fi
          printf '%s/target/cache/gradle/gradle-%s/bin\n' "$GITHUB_WORKSPACE" "$PRODUCT_GRADLE" >> "$GITHUB_PATH"
      - name: 编译真实内部宿主并汇入累计SDK
        id: build
        env:
          INTERNAL_TARGET: Android
        run: |
          set -euo pipefail
          result="$(node scripts/build.mjs native "$INTERNAL_TARGET")"
          work="$(printf '%s' "$result" | jq -r .work)"
          output="$(printf '%s' "$result" | jq -r .output)"
          # Windows Node返回原生盘符，Bash仅在路径边界使用官方cygpath转换。
          if [ "$RUNNER_OS" = Windows ]; then work="$(cygpath -u "$work")"; output="$(cygpath -u "$output")"; fi
          printf 'work=%s\n' "$work" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/native" "$RUNNER_TEMP/artifact"
          cp -R "$output/." "$RUNNER_TEMP/native/"
          if [ "$RUNNER_OS" = Windows ]; then tar --force-local -czf "$RUNNER_TEMP/artifact/公民SDK·SDK·v$SDK_VERSION.tgz" -C "$RUNNER_TEMP/native" .; else tar -czf "$RUNNER_TEMP/artifact/公民SDK·SDK·v$SDK_VERSION.tgz" -C "$RUNNER_TEMP/native" .; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 公民SDK·SDK·v${{ needs.select.outputs.version }}·Android
          path: ${{ runner.temp }}/artifact
          if-no-files-found: error
          compression-level: 0
      - name: 保存已安装Android组件
        if: ${{ always() && steps.android.outcome == 'success' }}
        env:
          PRODUCT_NDK: ${{ steps.tools.outputs.ndk }}
          PRODUCT_CMAKE: ${{ steps.tools.outputs.cmake }}
        run: |
          for component in "ndk/$PRODUCT_NDK" "cmake/$PRODUCT_CMAKE" platforms/android-36; do
            mkdir -p "target/cache/native/tools/android/${component%/*}"
            cp -Rp "$ANDROID_HOME/$component" "target/cache/native/tools/android/${component%/*}/"
          done
      - &save
        name: 保存官方增量缓存
        if: ${{ always() && steps.cache.outcome == 'success' && steps.rust.outcome == 'success' }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        continue-on-error: true
        timeout-minutes: 10
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/cache/rust
            target/cache/gradle-home
            target/cache/pub
            target/cache/flutter
            target/cache/sources
            target/cache/native
            target/cache/cmake
            target/cache/gradle
          key: sdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.rust }}-${{ steps.tools.outputs.flutter }}-${{ steps.tools.outputs.ndk }}-${{ steps.tools.outputs.node }}-${{ steps.tools.outputs.gradle }}-${{ steps.tools.outputs.cmake }}-${{ steps.tools.outputs.sqlite }}-${{ steps.tools.outputs.openssl }}-${{ steps.tools.outputs.tpm2_tss }}-${{ steps.tools.outputs.zxing }}-${{ hashFiles('Cargo.lock', 'pubspec.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 清理本轮独占现场
        if: ${{ always() && steps.build.outputs.work != '' }}
        env:
          PRODUCT_WORK: ${{ steps.build.outputs.work }}
        run: |
          workspace="$GITHUB_WORKSPACE"
          if [ "$RUNNER_OS" = Windows ]; then workspace="$(cygpath -u "$workspace")"; fi
          [[ "$PRODUCT_WORK" = "$workspace"/target/build/sdk-* ]]
          rm -rf "$PRODUCT_WORK"
  apple:
    needs: select
    name: 公民SDK·SDK·v${{ needs.select.outputs.version }}
    env:
      SDK_VERSION: ${{ needs.select.outputs.version }}
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - *tools
      - *cache
      - *nodecache
      - *node
      - *nodesave
      - *rust
      - &cmake
        name: 准备官方CMake
        env:
          PRODUCT_CMAKE: ${{ steps.tools.outputs.cmake }}
        run: |
          set -euo pipefail
          # 已有同版程序直接使用；其它版本不覆盖，缺件才恢复或下载固定官方包。
          binary="$(command -v cmake || true)"
          if [ -n "$binary" ]; then
            version="$("$binary" --version)"
            if [ "${version%%$'\n'*}" != "cmake version $PRODUCT_CMAKE" ]; then binary=; fi
          fi
          if [ -z "$binary" ]; then
            case "$RUNNER_OS-$RUNNER_ARCH" in
              Linux-ARM64) machine=linux-aarch64; format=tar.gz; executable=bin/cmake ;;
              macOS-ARM64) machine=macos-universal; format=tar.gz; executable=CMake.app/Contents/bin/cmake ;;
              Windows-X64) machine=windows-x86_64; format=zip; executable=bin/cmake.exe ;;
              *) exit 1 ;;
            esac
            package="cmake-$PRODUCT_CMAKE-$machine.$format"
            binary="$GITHUB_WORKSPACE/target/cache/cmake/cmake-$PRODUCT_CMAKE-$machine/$executable"
            if [ ! -x "$binary" ]; then
              mkdir -p target/cache/cmake
              curl --fail --location --proto '=https' --tlsv1.2 "https://github.com/Kitware/CMake/releases/download/v$PRODUCT_CMAKE/$package" -o "$RUNNER_TEMP/$package"
              case "$package" in *.zip) unzip -qo "$RUNNER_TEMP/$package" -d target/cache/cmake ;; *) tar -xzf "$RUNNER_TEMP/$package" -C target/cache/cmake ;; esac
            fi
            test -x "$binary"
          fi
          if [ "$RUNNER_OS" = Windows ]; then binary="$(cygpath -m "$binary")"; fi
          printf '%s\n' "${binary%/*}" >> "$GITHUB_PATH"
      - name: 准备官方Flutter
        env:
          PRODUCT_FLUTTER: ${{ steps.tools.outputs.flutter }}
        run: |
          if [ ! -x target/cache/flutter/bin/flutter ]; then git clone --depth 1 --branch "$PRODUCT_FLUTTER" https://github.com/flutter/flutter.git target/cache/flutter; fi
          printf 'FLUTTER_ROOT=%s/target/cache/flutter\nPUB_CACHE=%s/target/cache/pub\n' "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: 准备官方Flutter宿主和真实Rust、Dart回归
        env:
          CITIZENSDK_TRANSACTION_DIAGNOSTICS: '1'
        run: |
          "$FLUTTER_ROOT/bin/flutter" precache --macos
          node --test lib/test/build.test.mjs
          node scripts/build.mjs test
      - name: 编译真实内部宿主并汇入累计SDK
        id: build
        env:
          INTERNAL_TARGET: Apple
        run: |
          set -euo pipefail
          result="$(node scripts/build.mjs native "$INTERNAL_TARGET")"
          work="$(printf '%s' "$result" | jq -r .work)"
          output="$(printf '%s' "$result" | jq -r .output)"
          # Windows Node返回原生盘符，Bash仅在路径边界使用官方cygpath转换。
          if [ "$RUNNER_OS" = Windows ]; then work="$(cygpath -u "$work")"; output="$(cygpath -u "$output")"; fi
          printf 'work=%s\n' "$work" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/native" "$RUNNER_TEMP/artifact"
          cp -R "$output/." "$RUNNER_TEMP/native/"
          if [ "$RUNNER_OS" = Windows ]; then tar --force-local -czf "$RUNNER_TEMP/artifact/公民SDK·SDK·v$SDK_VERSION.tgz" -C "$RUNNER_TEMP/native" .; else tar -czf "$RUNNER_TEMP/artifact/公民SDK·SDK·v$SDK_VERSION.tgz" -C "$RUNNER_TEMP/native" .; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 公民SDK·SDK·v${{ needs.select.outputs.version }}·Apple
          path: ${{ runner.temp }}/artifact
          if-no-files-found: error
          compression-level: 0
      - *save
      - name: 清理本轮独占现场
        if: ${{ always() && steps.build.outputs.work != '' }}
        env:
          PRODUCT_WORK: ${{ steps.build.outputs.work }}
        run: |
          workspace="$GITHUB_WORKSPACE"
          if [ "$RUNNER_OS" = Windows ]; then workspace="$(cygpath -u "$workspace")"; fi
          [[ "$PRODUCT_WORK" = "$workspace"/target/build/sdk-* ]]
          rm -rf "$PRODUCT_WORK"
  linux:
    needs: select
    name: 公民SDK·SDK·v${{ needs.select.outputs.version }}
    env:
      SDK_VERSION: ${{ needs.select.outputs.version }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    # Debian 11提供glibc 2.31、GTK3和GStreamer 1.18，保留现有LinuxARM最低运行合同。
    container:
      image: debian:bullseye
      # 初始APT通过Runner既有公开CA验证官方HTTPS归档；不关闭TLS或包签名验证。
      options: --volume /etc/ssl/certs/ca-certificates.crt:/runner-ca.pem:ro
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - *tools
      - *cache
      - name: 准备官方系统构建工具
        run: |
          mkdir -p target/cache/native/tools/apt/archives/partial target/cache/native/tools/apt/lists/partial
          printf '%s\n' 'deb https://archive.debian.org/debian bullseye main' 'deb https://archive.debian.org/debian-security bullseye-security main' > /etc/apt/sources.list
          rm -f /etc/apt/sources.list.d/debian.sources
          apt-get -o Acquire::https::CaInfo=/runner-ca.pem -o Dir::Cache::Archives="$GITHUB_WORKSPACE/target/cache/native/tools/apt/archives" -o Dir::State::Lists="$GITHUB_WORKSPACE/target/cache/native/tools/apt/lists" -o Acquire::Check-Valid-Until=false update
