          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" > "$RUNNER_TEMP/caches.json"
          jq -r '[.[].actions_caches[] | select(.ref=="refs/heads/main") |
            select(.key|test("^sdk-(Linux-X64|Linux-ARM64|Windows-X64|macOS-ARM64)-")) |
            . + {host:(.key|capture("^sdk-(?<host>Linux-X64|Linux-ARM64|Windows-X64|macOS-ARM64)-").host)}] |
            group_by(.host)[] | sort_by(.created_at,.id) | reverse | .[1:][] | .id' "$RUNNER_TEMP/caches.json" |
          while IFS= read -r cache; do gh cache delete "$cache" --repo "$GITHUB_REPOSITORY"; done
