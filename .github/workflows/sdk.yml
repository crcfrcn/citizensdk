name: citizensdk.sdk
run-name: "${{ github.workflow }} · ${{ github.run_number }}"
'on':
  workflow_dispatch:
concurrency:
  group: "${{ github.repository }}-sdk"
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: "${{ steps.identity.outputs.version }}"
      tag: "${{ steps.identity.outputs.tag }}"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - name: 先执行本仓代码回归
        shell: bash
        run: node --test scripts/build.mjs
      - id: identity
        name: 确定正式版本与本次 Tag
        env:
          GH_TOKEN: "${{ github.token }}"
        shell: bash
        run: node scripts/build.mjs release-version
  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: Android, target: android, runner: ubuntu-24.04, rust-targets: aarch64-linux-android}
          - {platform: macOS, target: apple, runner: xcode-27, rust-targets: 'aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin'}
          - {platform: LinuxARM, target: LinuxARM, runner: ubuntu-24.04-arm, rust-targets: aarch64-unknown-linux-gnu}
          - {platform: LinuxAMD, target: LinuxAMD, runner: ubuntu-24.04, rust-targets: x86_64-unknown-linux-gnu}
          - {platform: Windows, target: Windows, runner: windows-2025, rust-targets: x86_64-pc-windows-msvc}
    runs-on: "${{ matrix.runner }}"
    timeout-minutes: 180
    env:
      GH_TOKEN: "${{ github.token }}"
      CARGO_INCREMENTAL: '1'
      SOFTWARE_VERSION: "${{ needs.prepare.outputs.version }}"
      SDK_PLATFORM: "${{ matrix.platform }}"
      SDK_TARGET: "${{ matrix.target }}"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
          targets: "${{ matrix.rust-targets }}"
          components: rust-src
      - name: Linux 编译依赖
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-dev libssl-dev pkg-config cmake ninja-build autoconf automake libtool make perl unzip zip xvfb dbus-x11
      - name: 安装 Android 固定 NDK 与 CMake
        if: matrix.platform == 'Android'
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_SDK_ROOT:?Runner缺少Android SDK根}"
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" "ndk;28.2.13676358" "cmake;3.31.6"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: 准备版本化独立源码
        shell: bash
        run: node scripts/build.mjs release-source native
      - name: 安装本仓固定 Flutter
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/flutter/flutter.git "$RUNNER_TEMP/citizensdk-flutter"
          git -C "$RUNNER_TEMP/citizensdk-flutter" checkout --detach d3b14c876900e553bc736ca19295fc09e3853e8e
          echo "FLUTTER_ROOT=$RUNNER_TEMP/citizensdk-flutter" >> "$GITHUB_ENV"
          echo "CITIZENSDK_FLUTTER_ROOT=$RUNNER_TEMP/citizensdk-flutter" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/citizensdk-flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/citizensdk-flutter/bin/flutter" --version
      - name: 恢复本平台编译与依赖缓存
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: |
            ${{ runner.temp }}/citizensdk-release/cargo-target
            ${{ runner.temp }}/citizensdk-release/pub-cache/hosted
            ${{ runner.temp }}/citizensdk-release/pub-cache/git
            ${{ runner.temp }}/citizensdk-release/gradle/caches/modules-2
            ${{ runner.temp }}/citizensdk-release/gradle/caches/build-cache-1
            ${{ runner.temp }}/citizensdk-release/gradle/wrapper/dists
            ${{ runner.temp }}/citizensdk-release/work/tools/archives
            ${{ runner.temp }}/citizensdk-flutter/bin/cache/artifacts/engine
          key: citizensdk-sdk-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-rust-1.97.1-flutter-d3b14c876900e553bc736ca19295fc09e3853e8e-${{ hashFiles('**/Cargo.lock', 'pubspec.lock', 'android/**/*.gradle', 'android/**/*.gradle.kts') }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            citizensdk-sdk-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-rust-1.97.1-flutter-d3b14c876900e553bc736ca19295fc09e3853e8e-${{ hashFiles('**/Cargo.lock', 'pubspec.lock', 'android/**/*.gradle', 'android/**/*.gradle.kts') }}-
      - name: 准备Apple固定引擎原件
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          "$FLUTTER_ROOT/bin/flutter" precache --ios --macos
      - name: 准备本仓锁定原件
        shell: bash
        run: |
          set -euo pipefail
          receipt="$(node "$CITIZENSDK_SOURCE_ROOT/scripts/build.mjs" prepare-environment --scope citizensdk --platform "$SDK_PLATFORM" --work "$CITIZENSDK_WORK_DIR/tools")"
          if [[ "$SDK_PLATFORM" == Android ]]; then
            printf '%s' "$receipt" | node -e '
              let input="";process.stdin.setEncoding("utf8");process.stdin.on("data",x=>input+=x);process.stdin.on("end",()=>{
                const fs=require("node:fs"),r=JSON.parse(input),root=process.env.CITIZENSDK_WORK_DIR+"/tools/";
                const gradle=r.tools?.gradle,java=r.tools?.java;
                if(r.platform!=="Android"||!gradle||!java||typeof gradle.version!=="string"||typeof java.version!=="string"
                  ||gradle.path!==root+"gradle-"+gradle.version+"/bin/gradle"||java.home!==root+"java-"+java.version
                  ||!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(gradle.version)||!/^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$/.test(java.version)
                  ||/[\r\n=]/.test(gradle.path+java.home))throw Error("Android锁定Gradle/Java准备回执无效");
                fs.accessSync(gradle.path,fs.constants.X_OK);fs.accessSync(java.home+"/bin/java",fs.constants.X_OK);
                fs.appendFileSync(process.env.GITHUB_ENV,"CITIZENSDK_GRADLE="+gradle.path+"\nJAVA_HOME="+java.home+"\n");
              });
            '
          fi
      - name: 启用 Windows MSVC 工具
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Windows 缺少 MSVC C++ 工具' }
          Import-Module "$installation\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          foreach ($name in @('PATH','INCLUDE','LIB','LIBPATH','VCINSTALLDIR','VSINSTALLDIR','VCToolsInstallDir','WindowsSdkDir','WindowsSDKVersion')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if (-not $value -or $value.Contains("$([char]10)")) { throw "MSVC 环境无效：$name" }
            "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          foreach ($name in @('cl.exe','lib.exe','dumpbin.exe')) { Get-Command $name -ErrorAction Stop | Out-Null }
      - name: 准备 Linux 与 Windows 静态原生依赖
        if: matrix.platform == 'LinuxARM' || matrix.platform == 'LinuxAMD' || matrix.platform == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          result="$CITIZENSDK_WORK_DIR/dependency-result.json"
          if [[ "$SDK_PLATFORM" == Windows ]]; then result="$(cygpath -u "$result")"; fi
          node "$CITIZENSDK_SOURCE_ROOT/scripts/build.mjs" prepare-native \
            --scope citizensdk --platform "$SDK_PLATFORM" --mode release \
            --sdk "$CITIZENSDK_SOURCE_ROOT" --work "$CITIZENSDK_WORK_DIR/dependencies" \
            --sources "$CITIZENSDK_WORK_DIR/tools" \
            --source-sha "$GITHUB_SHA" --software-version "$SOFTWARE_VERSION" > "$result"
          node scripts/build.mjs release-dependency-env
      - name: 编译本平台原生件
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SDK_PLATFORM" == Windows ]]; then
            export CITIZENSDK_SOURCE_ROOT="$(cygpath -u "$CITIZENSDK_SOURCE_ROOT")"
            export CITIZENSDK_SOURCE="$CITIZENSDK_SOURCE_ROOT"
            export CITIZENSDK_WORK_DIR="$(cygpath -u "$CITIZENSDK_WORK_DIR")"
            export CITIZENSDK_NATIVE_OUTPUT_DIR="$(cygpath -u "$CITIZENSDK_NATIVE_OUTPUT_DIR")"
            export CITIZENSDK_DEPENDENCY_RECEIPT="$(cygpath -u "$CITIZENSDK_DEPENDENCY_RECEIPT")"
            export CITIZENSDK_FLUTTER_ROOT="$(cygpath -u "$CITIZENSDK_FLUTTER_ROOT")"
            export CITIZENSDK_ZXING_SOURCE_DIR="$(cygpath -u "$CITIZENSDK_ZXING_SOURCE_DIR")"
            export PUB_CACHE="$(cygpath -u "$PUB_CACHE")"
          fi
          if [[ "$SDK_PLATFORM" == LinuxARM || "$SDK_PLATFORM" == LinuxAMD ]]; then
            xvfb-run -a dbus-run-session -- node "$CITIZENSDK_SOURCE_ROOT/scripts/build.mjs" native "$SDK_TARGET"
          else
            node "$CITIZENSDK_SOURCE_ROOT/scripts/build.mjs" native "$SDK_TARGET"
          fi
          if [[ "$SDK_PLATFORM" == macOS ]]; then
            node "$CITIZENSDK_SOURCE_ROOT/scripts/build.mjs" native apple-tests
            node "$CITIZENSDK_SOURCE_ROOT/scripts/build.mjs" native abi-host
            node "$CITIZENSDK_SOURCE_ROOT/scripts/build.mjs" native host
            cp "$CITIZENSDK_NATIVE_OUTPUT_DIR/host/libsmoldot.dylib" "$CITIZENSDK_SOURCE_ROOT/libsmoldot.dylib"
            (cd "$CITIZENSDK_SOURCE_ROOT" && flutter test --timeout=2m)
          fi
          if [[ "$SDK_PLATFORM" == Android ]]; then
            export CITIZENSDK_ANDROID_CORE_DIR="$CITIZENSDK_NATIVE_OUTPUT_DIR/android/arm64-v8a"
            export CITIZENSDK_ANDROID_BUILD_DIR="$CITIZENSDK_WORK_DIR/gradle-native"
            "$CITIZENSDK_GRADLE" --no-daemon --build-cache -p "$CITIZENSDK_SOURCE_ROOT/android" :native:testReleaseUnitTest
            host="$CITIZENSDK_WORK_DIR/android-consumer"
            flutter create --platforms=android --org org.citizensdk.verify --project-name citizensdk_verify "$host"
            flutter pub add --directory "$host" citizen_sdk --path "$CITIZENSDK_SOURCE_ROOT"
            export CITIZENSDK_ANDROID_BUILD_DIR="$CITIZENSDK_WORK_DIR/gradle-flutter"
            (cd "$host" && flutter build apk --release --target-platform android-arm64 --no-pub)
          fi
      - name: 绑定原生依赖与运行库证据
        if: matrix.platform == 'LinuxARM' || matrix.platform == 'LinuxAMD' || matrix.platform == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs release-dependency-evidence
      - name: 保存当前 Run 原生件
        shell: bash
        run: |
          set -euo pipefail
          output="$CITIZENSDK_NATIVE_OUTPUT_DIR"
          if [[ "$SDK_PLATFORM" == Windows ]]; then output="$(cygpath -u "$output")"; fi
          case "$SDK_PLATFORM" in
            Android) paths=(android) ;;
            macOS) paths=(apple) ;;
            LinuxARM|LinuxAMD) paths=("linux/$SDK_PLATFORM" "dependencies/$SDK_PLATFORM.json") ;;
            Windows) paths=(Windows dependencies/Windows.json) ;;
            *) exit 1 ;;
          esac
          for path in "${paths[@]}"; do test -e "$output/$path"; done
          tar -czf "$RUNNER_TEMP/citizensdk-$SDK_PLATFORM.tgz" -C "$output" "${paths[@]}"
          test -s "$RUNNER_TEMP/citizensdk-$SDK_PLATFORM.tgz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "native-${{ matrix.platform }}"
          path: "${{ runner.temp }}/citizensdk-${{ matrix.platform }}.tgz"
          if-no-files-found: error
          retention-days: 7
  assemble:
    needs: [prepare, native]
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      SOFTWARE_VERSION: "${{ needs.prepare.outputs.version }}"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-*
          path: "${{ runner.temp }}/native-artifacts"
          merge-multiple: false
      - name: 汇总同一源码的五平台原生件并构造正式包
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/citizensdk-native"
          for platform in Android macOS LinuxARM LinuxAMD Windows; do
            archive="$RUNNER_TEMP/native-artifacts/native-$platform/citizensdk-$platform.tgz"
            test -s "$archive"
            tar -xzf "$archive" -C "$RUNNER_TEMP/citizensdk-native"
          done
          node scripts/build.mjs release-source assemble
          node scripts/build.mjs release-build \
            --source "$RUNNER_TEMP/citizensdk-source" \
            --native "$RUNNER_TEMP/citizensdk-native" \
            --output "$RUNNER_TEMP/citizensdk-candidate" \
            --archive "$RUNNER_TEMP/citizensdk.tgz" \
            --git-sha "$GITHUB_SHA" --software-version "$SOFTWARE_VERSION"
          node scripts/build.mjs release-verify --verify "$RUNNER_TEMP/citizensdk-candidate" \
            --archive "$RUNNER_TEMP/citizensdk.tgz" --expected-git-sha "$GITHUB_SHA"
          test -s "$RUNNER_TEMP/citizensdk.tgz"
          tar -czf "$RUNNER_TEMP/citizensdk-candidate.tgz" -C "$RUNNER_TEMP/citizensdk-candidate" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-output
          path: "${{ runner.temp }}/citizensdk.tgz"
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-output
          path: "${{ runner.temp }}/citizensdk-candidate.tgz"
          if-no-files-found: error
          retention-days: 7
  consume:
    needs: [prepare, assemble]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: Android, runner: ubuntu-24.04}
          - {platform: macOS, runner: xcode-27}
          - {platform: LinuxARM, runner: ubuntu-24.04-arm}
          - {platform: LinuxAMD, runner: ubuntu-24.04}
          - {platform: Windows, runner: windows-2025}
    runs-on: "${{ matrix.runner }}"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-output
          path: "${{ runner.temp }}/citizensdk-release"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-output
          path: "${{ runner.temp }}/citizensdk-candidate-artifact"
      - name: 本平台复验同一正式候选
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/citizensdk-candidate"
          tar -xzf "$RUNNER_TEMP/citizensdk-candidate-artifact/citizensdk-candidate.tgz" -C "$RUNNER_TEMP/citizensdk-candidate"
          node scripts/build.mjs release-verify --verify "$RUNNER_TEMP/citizensdk-candidate" \
            --archive "$RUNNER_TEMP/citizensdk-release/citizensdk.tgz" \
            --expected-git-sha "$GITHUB_SHA"
  release:
    needs: [prepare, native, assemble, consume]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: "${{ github.token }}"
      RELEASE_TAG: "${{ needs.prepare.outputs.tag }}"
      RELEASE_VERSION: "${{ needs.prepare.outputs.version }}"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-output
          path: "${{ runner.temp }}/citizensdk-release"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-output
          path: "${{ runner.temp }}/citizensdk-candidate-artifact"
      - name: 创建并逐件回读唯一正式 SDK Release
        shell: bash
        run: node scripts/build.mjs release-github
