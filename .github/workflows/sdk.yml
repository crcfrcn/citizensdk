            & cl /nologo /c /O2 /MD /DSQLITE_THREADSAFE=1 "$env:GITHUB_WORKSPACE/target/cache/sources/sqlite-amalgamation-3530400/sqlite3.c" "/Fo$env:RUNNER_TEMP/sqlite3.obj"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & lib /nologo "/OUT:$prefix/lib/sqlite3.lib" "$env:RUNNER_TEMP/sqlite3.obj"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
