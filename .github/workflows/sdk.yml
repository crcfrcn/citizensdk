  windows:
    needs: select
    name: 公民SDK·SDK·v${{ needs.select.outputs.version }}
    env:
      SDK_VERSION: ${{ needs.select.outputs.version }}
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
