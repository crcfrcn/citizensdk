        run: |
          mkdir -p "$RUNNER_TEMP/native"
          for target in Android Apple LinuxARM Windows; do tar -xzf "${RUNNER_TEMP}/previous/公民SDK·SDK·v${SDK_VERSION}·${target}/公民SDK·SDK·v${SDK_VERSION}.tgz" -C "${RUNNER_TEMP}/native"; done
      - name: 编译并汇总完整SDK
        id: build
        run: |
          result="$(node scripts/build.mjs package "$RUNNER_TEMP/native")"
          work="$(printf '%s' "$result" | jq -r .work)"
          project="$(printf '%s' "$result" | jq -r .output)"
          [[ "${work%/*}" = "$GITHUB_WORKSPACE/target/build" && "${work##*/}" =~ ^sdk-[A-Za-z0-9]+$ && "$project" = "$work/output" ]]
          test "$(cd "$work" && pwd -P)" = "$work"
          printf 'work=%s\n' "$work" >> "$GITHUB_OUTPUT"
          name="公民SDK·SDK·v$SDK_VERSION"
          artifact="$RUNNER_TEMP/sdk-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$artifact"
          ditto -c -k --sequesterRsrc --keepParent "$project" "$artifact/$name.zip"
          digest="$(shasum -a 256 "$artifact/$name.zip" | cut -d ' ' -f 1)"
          jq -n --arg version "$SDK_VERSION" --arg sha "$GITHUB_SHA" --argjson run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" --arg file "$name.zip" --arg digest "$digest" \
            '{product_id:"citizensdk",platform:"sdk",software_version:$version,git_commit_sha:$sha,producer_run_id:$run,producer_run_attempt:$attempt,assets:[{name:$file,sha256:$digest}]}' > "$artifact/$name.json"
          (cd "$artifact" && shasum -a 256 "$name.zip" "$name.json" > "$name.sha256")
          CITIZENSDK_PACKAGE="$artifact" node scripts/build.mjs consume "$GITHUB_SHA" "$work/consumer" >/dev/null
          printf 'path=%s\n' "$artifact" >> "$GITHUB_OUTPUT"
      - id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 公民SDK·SDK·v${{ needs.select.outputs.version }}
          path: ${{ steps.build.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - name: 清理本轮SDK编译现场
        continue-on-error: true
        if: ${{ always() && steps.build.outputs.work != '' }}
        env:
          SDK_WORK_DIRECTORY: ${{ steps.build.outputs.work }}
        run: |
          [[ "${SDK_WORK_DIRECTORY%/*}" = "$GITHUB_WORKSPACE/target/build" && "${SDK_WORK_DIRECTORY##*/}" =~ ^sdk-[A-Za-z0-9]+$ ]]
          test "$(cd "$SDK_WORK_DIRECTORY" && pwd -P)" = "$SDK_WORK_DIRECTORY"
          rm -rf "$SDK_WORK_DIRECTORY"
