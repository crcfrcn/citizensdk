          jq -r --argjson current "$GITHUB_RUN_ID" --slurpfile keep "$RUNNER_TEMP/keep.json" '
            [.[].workflow_runs[] | select(.status=="completed" and .id!=$current)] | sort_by(.conclusion=="success",.run_number)[] |
            select(.id as $id | $keep[0] | index($id) | not) | .id' "$RUNNER_TEMP/runs.json" |
          while IFS= read -r run; do gh run delete "$run" --repo "$GITHUB_REPOSITORY"; done
