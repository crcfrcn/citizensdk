        shell: pwsh
        run: |
          $installation = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$installation/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $compilerBin = Split-Path (Get-Command cl.exe -CommandType Application).Source
          "CITIZENSDK_MSVC_BIN=$compilerBin","CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$(Join-Path $compilerBin 'link.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem Env: | ForEach-Object { if ($_.Name -in @('PATH','INCLUDE','LIB','LIBPATH','VCToolsInstallDir','VCINSTALLDIR','WindowsSdkDir','WindowsSDKVersion')) { "$($_.Name)=$($_.Value)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 } }
      - name: 构建锁定SQLite静态库
        shell: pwsh
        run: |
          $prefix = "$env:GITHUB_WORKSPACE/target/cache/native"
