  complete:
    needs: [select, android, apple, linux, windows]
    name: 公民SDK·SDK·v${{ needs.select.outputs.version }}
    env:
      SDK_VERSION: ${{ needs.select.outputs.version }}
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 240
    outputs:
      artifact: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: tools
        name: 从本产品声明读取Node版本
        run: |
          node_version="$(sed -n "s/.*node:'\([^']*\)'.*/\1/p" scripts/config.mjs)"
          [[ "$node_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
