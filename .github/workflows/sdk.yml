# SDK唯一公开平台；四个内部宿主独立构建，内部传递包按用户确认增加目标后缀。
name: 公民SDK·SDK
run-name: 公民SDK·SDK·v${{ inputs.version }}
'on':
  workflow_dispatch:
    inputs:
      version:
        description: 从最新成功Run计算的候选版本
        required: true
        type: string
concurrency:
  group: ${{ github.repository }}-sdk
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
env:
  SDK_VERSION: ${{ inputs.version }}
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
jobs:
  android:
    name: 公民SDK·SDK·v${{ inputs.version }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: bootstrap
        name: 从本产品声明读取Node版本
        run: |
          node_version="$(sed -n "s/.*node:'\([^']*\)'.*/\1/p" scripts/config.mjs)"
          [[ "$node_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'node=%s\n' "$node_version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ steps.bootstrap.outputs.node }}
      - id: tools
        name: 读取本产品工具声明
        run: |
          node --input-type=module -e 'import {tools} from "./scripts/config.mjs";for(const [name,value] of Object.entries(tools))console.log(name+"="+value)' >> "$GITHUB_OUTPUT"
      - name: 恢复官方增量缓存
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        continue-on-error: true
        timeout-minutes: 2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/cache/rust
            target/cache/gradle-home
            target/cache/pub
            target/cache/flutter
            target/cache/sources
            target/cache/native
            target/cache/cmake
            target/cache/gradle
          key: sdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.rust }}-${{ steps.tools.outputs.flutter }}-${{ steps.tools.outputs.ndk }}-${{ hashFiles('scripts/config.mjs') }}-${{ hashFiles('Cargo.lock', 'pubspec.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.rust }}-${{ steps.tools.outputs.flutter }}-${{ steps.tools.outputs.ndk }}-${{ hashFiles('scripts/config.mjs') }}-${{ hashFiles('Cargo.lock', 'pubspec.lock') }}-
            sdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.rust }}-${{ steps.tools.outputs.flutter }}-${{ steps.tools.outputs.ndk }}-${{ hashFiles('scripts/config.mjs') }}-
          fail-on-cache-miss: false
      - name: 准备官方Rust与二维码源码
        env:
          PRODUCT_RUST: ${{ steps.tools.outputs.rust }}
        run: |
          set -euo pipefail
          rustup toolchain install "$PRODUCT_RUST" --profile minimal
          mkdir -p target/cache/sources
          node --input-type=module -e 'import {nativeSources} from "./scripts/config.mjs";for(const [name,value] of Object.entries(nativeSources))console.log([name,value.url,value.archive_root].join(" "))' > "$RUNNER_TEMP/native-sources.txt"
          while read -r source url directory; do
            case "$RUNNER_OS-$RUNNER_ARCH-$source" in *-zxing|Linux-ARM64-*|Windows-X64-sqlite) ;; *) continue ;; esac
            if [ ! -d "target/cache/sources/$directory" ]; then
              case "$url" in *.zip) archive="$RUNNER_TEMP/$source.zip" ;; *) archive="$RUNNER_TEMP/$source.tar.gz" ;; esac
              curl --fail --location --proto '=https' --tlsv1.2 "$url" -o "$archive"
              case "$archive" in *.zip) unzip -q "$archive" -d target/cache/sources ;; *) if [ "$RUNNER_OS" = Windows ]; then tar --force-local -xzf "$archive" -C target/cache/sources; else tar -xzf "$archive" -C target/cache/sources; fi ;; esac
            fi
          done < "$RUNNER_TEMP/native-sources.txt"
          printf 'CITIZENSDK_ZXING_SOURCE_DIR=%s/target/cache/sources/zxing-cpp-3.1.1\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: 准备官方Flutter Android embedding
        env:
          PRODUCT_FLUTTER: ${{ steps.tools.outputs.flutter }}
        run: |
          if [ ! -x target/cache/flutter/bin/flutter ]; then git clone --depth 1 --branch "$PRODUCT_FLUTTER" https://github.com/flutter/flutter.git target/cache/flutter; fi
          "$GITHUB_WORKSPACE/target/cache/flutter/bin/flutter" precache --android
          printf 'FLUTTER_ROOT=%s/target/cache/flutter\nPUB_CACHE=%s/target/cache/pub\n' "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: 准备官方Android和Gradle
        env:
          PRODUCT_NDK: ${{ steps.tools.outputs.ndk }}
          PRODUCT_CMAKE: ${{ steps.tools.outputs.cmake }}
          PRODUCT_GRADLE: ${{ steps.tools.outputs.gradle }}
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$PRODUCT_NDK" "cmake;$PRODUCT_CMAKE" "platforms;android-36"
          printf 'ANDROID_NDK_HOME=%s/ndk/%s\n' "$ANDROID_HOME" "$PRODUCT_NDK" >> "$GITHUB_ENV"
          if [ ! -d "target/cache/gradle/gradle-$PRODUCT_GRADLE" ]; then
            curl --fail --location --proto '=https' --tlsv1.2 "https://services.gradle.org/distributions/gradle-$PRODUCT_GRADLE-bin.zip" -o "$RUNNER_TEMP/gradle.zip"
            mkdir -p target/cache/gradle
            unzip -q "$RUNNER_TEMP/gradle.zip" -d target/cache/gradle
          fi
          printf '%s/target/cache/gradle/gradle-%s/bin\n' "$GITHUB_WORKSPACE" "$PRODUCT_GRADLE" >> "$GITHUB_PATH"
      - name: 核对候选版本
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/sdk.yml/runs?branch=main&event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/sdk-runs.json"
          node --input-type=module - "$RUNNER_TEMP/sdk-runs.json" <<'NODE'
          import {readFileSync} from 'node:fs';
          import {nextVersion,sdkName} from './scripts/build.mjs';
          const rows=JSON.parse(readFileSync(process.argv[2],'utf8')).flatMap(page=>page.workflow_runs);
          if(nextVersion(rows)!==process.env.SDK_VERSION)throw Error('候选版本已变化');
          sdkName(process.env.SDK_VERSION);
          NODE
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: 编译真实内部宿主并汇入累计SDK
        id: build
        env:
          INTERNAL_TARGET: Android
        run: |
          set -euo pipefail
          result="$(node scripts/build.mjs native "$INTERNAL_TARGET")"
          work="$(printf '%s' "$result" | jq -r .work)"
          output="$(printf '%s' "$result" | jq -r .output)"
          # Windows Node返回原生盘符，Bash仅在路径边界使用官方cygpath转换。
          if [ "$RUNNER_OS" = Windows ]; then work="$(cygpath -u "$work")"; output="$(cygpath -u "$output")"; fi
          printf 'work=%s\n' "$work" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/native" "$RUNNER_TEMP/artifact"
          cp -R "$output/." "$RUNNER_TEMP/native/"
          if [ "$RUNNER_OS" = Windows ]; then tar --force-local -czf "$RUNNER_TEMP/artifact/公民SDK·SDK·v$SDK_VERSION.tgz" -C "$RUNNER_TEMP/native" .; else tar -czf "$RUNNER_TEMP/artifact/公民SDK·SDK·v$SDK_VERSION.tgz" -C "$RUNNER_TEMP/native" .; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 公民SDK·SDK·v${{ inputs.version }}·Android
          path: ${{ runner.temp }}/artifact
          if-no-files-found: error
          compression-level: 0
      - name: 保存官方增量缓存
        if: ${{ always() && steps.tools.outcome == 'success' }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        continue-on-error: true
        timeout-minutes: 2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/cache/rust
            target/cache/gradle-home
            target/cache/pub
            target/cache/flutter
            target/cache/sources
            target/cache/native
            target/cache/cmake
            target/cache/gradle
          key: sdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.rust }}-${{ steps.tools.outputs.flutter }}-${{ steps.tools.outputs.ndk }}-${{ hashFiles('scripts/config.mjs') }}-${{ hashFiles('Cargo.lock', 'pubspec.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 清理本轮独占现场
        if: ${{ always() && steps.build.outputs.work != '' }}
        env:
          PRODUCT_WORK: ${{ steps.build.outputs.work }}
        run: |
          workspace="$GITHUB_WORKSPACE"
          if [ "$RUNNER_OS" = Windows ]; then workspace="$(cygpath -u "$workspace")"; fi
          [[ "$PRODUCT_WORK" = "$workspace"/target/build/sdk-* ]]
          rm -rf "$PRODUCT_WORK"
  apple:
    name: 公民SDK·SDK·v${{ inputs.version }}
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: bootstrap
        name: 从本产品声明读取Node版本
        run: |
          node_version="$(sed -n "s/.*node:'\([^']*\)'.*/\1/p" scripts/config.mjs)"
          [[ "$node_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'node=%s\n' "$node_version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ steps.bootstrap.outputs.node }}
      - id: tools
        name: 读取本产品工具声明
        run: |
          node --input-type=module -e 'import {tools} from "./scripts/config.mjs";for(const [name,value] of Object.entries(tools))console.log(name+"="+value)' >> "$GITHUB_OUTPUT"
      - name: 恢复官方增量缓存
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        continue-on-error: true
        timeout-minutes: 2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/cache/rust
            target/cache/gradle-home
            target/cache/pub
            target/cache/flutter
            target/cache/sources
            target/cache/native
            target/cache/cmake
            target/cache/gradle
          key: sdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.rust }}-${{ steps.tools.outputs.flutter }}-${{ steps.tools.outputs.ndk }}-${{ hashFiles('scripts/config.mjs') }}-${{ hashFiles('Cargo.lock', 'pubspec.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.rust }}-${{ steps.tools.outputs.flutter }}-${{ steps.tools.outputs.ndk }}-${{ hashFiles('scripts/config.mjs') }}-${{ hashFiles('Cargo.lock', 'pubspec.lock') }}-
            sdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.rust }}-${{ steps.tools.outputs.flutter }}-${{ steps.tools.outputs.ndk }}-${{ hashFiles('scripts/config.mjs') }}-
          fail-on-cache-miss: false
      - name: 准备官方Rust与二维码源码
        env:
          PRODUCT_RUST: ${{ steps.tools.outputs.rust }}
        run: |
          set -euo pipefail
          rustup toolchain install "$PRODUCT_RUST" --profile minimal
          mkdir -p target/cache/sources
          node --input-type=module -e 'import {nativeSources} from "./scripts/config.mjs";for(const [name,value] of Object.entries(nativeSources))console.log([name,value.url,value.archive_root].join(" "))' > "$RUNNER_TEMP/native-sources.txt"
          while read -r source url directory; do
            case "$RUNNER_OS-$RUNNER_ARCH-$source" in *-zxing|Linux-ARM64-*|Windows-X64-sqlite) ;; *) continue ;; esac
            if [ ! -d "target/cache/sources/$directory" ]; then
              case "$url" in *.zip) archive="$RUNNER_TEMP/$source.zip" ;; *) archive="$RUNNER_TEMP/$source.tar.gz" ;; esac
              curl --fail --location --proto '=https' --tlsv1.2 "$url" -o "$archive"
              case "$archive" in *.zip) unzip -q "$archive" -d target/cache/sources ;; *) if [ "$RUNNER_OS" = Windows ]; then tar --force-local -xzf "$archive" -C target/cache/sources; else tar -xzf "$archive" -C target/cache/sources; fi ;; esac
            fi
          done < "$RUNNER_TEMP/native-sources.txt"
          printf 'CITIZENSDK_ZXING_SOURCE_DIR=%s/target/cache/sources/zxing-cpp-3.1.1\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: 准备官方CMake
        env:
          PRODUCT_CMAKE: ${{ steps.tools.outputs.cmake }}
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-ARM64) machine=linux-aarch64; format=tar.gz; executable=bin/cmake ;;
            macOS-ARM64) machine=macos-universal; format=tar.gz; executable=CMake.app/Contents/bin/cmake ;;
            Windows-X64) machine=windows-x86_64; format=zip; executable=bin/cmake.exe ;;
            *) exit 1 ;;
          esac
          package="cmake-$PRODUCT_CMAKE-$machine.$format"
          binary="$GITHUB_WORKSPACE/target/cache/cmake/cmake-$PRODUCT_CMAKE-$machine/$executable"
          mkdir -p target/cache/cmake
          if [ ! -x "$binary" ]; then
            curl --fail --location --proto '=https' --tlsv1.2 "https://github.com/Kitware/CMake/releases/download/v$PRODUCT_CMAKE/$package" -o "$RUNNER_TEMP/$package"
            case "$package" in *.zip) unzip -qo "$RUNNER_TEMP/$package" -d target/cache/cmake ;; *) tar -xzf "$RUNNER_TEMP/$package" -C target/cache/cmake ;; esac
          fi
          test -x "$binary"
          printf '%s\n' "${binary%/*}" >> "$GITHUB_PATH"
      - name: 准备官方Flutter
        env:
          PRODUCT_FLUTTER: ${{ steps.tools.outputs.flutter }}
        run: |
          if [ ! -x target/cache/flutter/bin/flutter ]; then git clone --depth 1 --branch "$PRODUCT_FLUTTER" https://github.com/flutter/flutter.git target/cache/flutter; fi
          printf 'FLUTTER_ROOT=%s/target/cache/flutter\nPUB_CACHE=%s/target/cache/pub\n' "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: 准备官方Flutter宿主和真实Rust、Dart回归
        run: |
          "$FLUTTER_ROOT/bin/flutter" precache --ios --macos --android
          node --test test/build.test.mjs
          node scripts/build.mjs test
      - name: 编译真实内部宿主并汇入累计SDK
        id: build
        env:
          INTERNAL_TARGET: Apple
        run: |
          set -euo pipefail
          result="$(node scripts/build.mjs native "$INTERNAL_TARGET")"
          work="$(printf '%s' "$result" | jq -r .work)"
          output="$(printf '%s' "$result" | jq -r .output)"
          # Windows Node返回原生盘符，Bash仅在路径边界使用官方cygpath转换。
          if [ "$RUNNER_OS" = Windows ]; then work="$(cygpath -u "$work")"; output="$(cygpath -u "$output")"; fi
          printf 'work=%s\n' "$work" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/native" "$RUNNER_TEMP/artifact"
          cp -R "$output/." "$RUNNER_TEMP/native/"
          if [ "$RUNNER_OS" = Windows ]; then tar --force-local -czf "$RUNNER_TEMP/artifact/公民SDK·SDK·v$SDK_VERSION.tgz" -C "$RUNNER_TEMP/native" .; else tar -czf "$RUNNER_TEMP/artifact/公民SDK·SDK·v$SDK_VERSION.tgz" -C "$RUNNER_TEMP/native" .; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 公民SDK·SDK·v${{ inputs.version }}·Apple
          path: ${{ runner.temp }}/artifact
          if-no-files-found: error
          compression-level: 0
      - name: 保存官方增量缓存
        if: ${{ always() && steps.tools.outcome == 'success' }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        continue-on-error: true
        timeout-minutes: 2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/cache/rust
            target/cache/gradle-home
            target/cache/pub
            target/cache/flutter
            target/cache/sources
            target/cache/native
            target/cache/cmake
            target/cache/gradle
          key: sdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.rust }}-${{ steps.tools.outputs.flutter }}-${{ steps.tools.outputs.ndk }}-${{ hashFiles('scripts/config.mjs') }}-${{ hashFiles('Cargo.lock', 'pubspec.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 清理本轮独占现场
        if: ${{ always() && steps.build.outputs.work != '' }}
        env:
          PRODUCT_WORK: ${{ steps.build.outputs.work }}
        run: |
          workspace="$GITHUB_WORKSPACE"
          if [ "$RUNNER_OS" = Windows ]; then workspace="$(cygpath -u "$workspace")"; fi
          [[ "$PRODUCT_WORK" = "$workspace"/target/build/sdk-* ]]
          rm -rf "$PRODUCT_WORK"
  linux:
    name: 公民SDK·SDK·v${{ inputs.version }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    # Debian 11提供glibc 2.31、GTK3和GStreamer 1.18，保留现有LinuxARM最低运行合同。
    container:
      image: debian:bullseye
      # 初始APT通过Runner既有公开CA验证官方HTTPS归档；不关闭TLS或包签名验证。
      options: --volume /etc/ssl/certs/ca-certificates.crt:/runner-ca.pem:ro
    steps:
      - name: 准备官方系统构建工具
        run: |
          printf '%s\n' 'deb https://archive.debian.org/debian bullseye main' 'deb https://archive.debian.org/debian-security bullseye-security main' > /etc/apt/sources.list
          rm -f /etc/apt/sources.list.d/debian.sources
          apt-get -o Acquire::https::CaInfo=/runner-ca.pem -o Acquire::Check-Valid-Until=false update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::https::CaInfo=/runner-ca.pem install -y ca-certificates curl git unzip build-essential pkg-config clang-16=1:16.0.6-15~deb11u2 llvm-16=1:16.0.6-15~deb11u2 libclang-16-dev=1:16.0.6-15~deb11u2 ninja-build jq zip dbus-x11 file procps perl libtool automake autoconf libglib2.0-dev libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libjson-c-dev libssl-dev libcurl4-openssl-dev libusb-1.0-0-dev python3 xz-utils xvfb xauth
          curl --fail --location --proto '=https' --tlsv1.2 https://sh.rustup.rs -o "$RUNNER_TEMP/rustup.sh"
          sh "$RUNNER_TEMP/rustup.sh" -y --profile minimal --default-toolchain none --no-modify-path
          printf 'CC=/usr/bin/clang-16\nCXX=/usr/bin/clang++-16\nLIBCLANG_PATH=/usr/lib/llvm-16/lib\n' >> "$GITHUB_ENV"
          # Flutter官方后端固定调用clang/clang++；只在本轮PATH提供同一Clang16官方二进制。
          mkdir "$RUNNER_TEMP/citizensdk-clang"
          ln -s /usr/bin/clang-16 "$RUNNER_TEMP/citizensdk-clang/clang"
          ln -s /usr/bin/clang++-16 "$RUNNER_TEMP/citizensdk-clang/clang++"
          printf '%s/citizensdk-clang\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
          printf '%s/.cargo/bin\n' "$HOME" >> "$GITHUB_PATH"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: bootstrap
