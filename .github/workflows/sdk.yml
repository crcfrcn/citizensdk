name: 公民SDK·SDK
run-name: "公民SDK·SDK·v${{ inputs.version }}"
'on':
  workflow_dispatch:
    inputs:
      version:
        description: 公民SDK本轮候选版本
        required: true
        type: string
concurrency:
  group: "${{ github.repository }}-sdk"
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    name: "公民SDK·SDK·v${{ inputs.version }}"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: "${{ steps.identity.outputs.version }}"
      tag: "${{ steps.identity.outputs.tag }}"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - name: 先执行本仓代码回归
        shell: bash
        run: node --test scripts/build.mjs
      - id: identity
        name: 确定正式版本与本次 Tag
        env:
          GH_TOKEN: "${{ github.token }}"
          EXPECTED_RELEASE_VERSION: "${{ inputs.version }}"
        shell: bash
        run: node scripts/build.mjs release-version
  native:
    name: "公民SDK·${{ matrix.platform }}·v${{ inputs.version }}"
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: Android, target: android, runner: ubuntu-24.04, rust-targets: aarch64-linux-android}
          - {platform: macOS, target: apple, runner: xcode-27, rust-targets: 'aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin'}
          - {platform: Windows, target: Windows, runner: windows-2025, rust-targets: x86_64-pc-windows-msvc}
    runs-on: "${{ matrix.runner }}"
    timeout-minutes: 180
    env:
      GH_TOKEN: "${{ github.token }}"
      CARGO_INCREMENTAL: '1'
      SOFTWARE_VERSION: "${{ needs.prepare.outputs.version }}"
      SDK_PLATFORM: "${{ matrix.platform }}"
      SDK_TARGET: "${{ matrix.target }}"
      CITIZENSDK_VERIFY_TESTS: 'true'
    steps: &native_steps
      - name: 固定 Linux GLIBC 2.31 构建根
        if: matrix.platform == 'LinuxARM'
        shell: bash
        run: |
          set -euo pipefail
          test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.31'
          # 基础镜像没有CA包；首次APT仍由Debian签名InRelease与包摘要验真。
          printf '%s\n' \
            'deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260901T000000Z bullseye main' \
            'deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/20260901T000000Z bullseye-security main' \
            > /etc/apt/sources.list
          rm -f /etc/apt/sources.list.d/debian.sources
          apt-get -o Acquire::Check-Valid-Until=false update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates
          sed -i 's@http://snapshot.debian.org@https://snapshot.debian.org@g' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            curl git gcc g++ libstdc++6 liblzma5=5.2.5-2.1~deb11u2 \
            liblzma-dev=5.2.5-2.1~deb11u2 \
            clang-16=1:16.0.6-15~deb11u2 llvm-16=1:16.0.6-15~deb11u2 \
            libclang-16-dev=1:16.0.6-15~deb11u2 libssl-dev \
            libglib2.0-dev libgtk-3-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev pkg-config ninja-build \
            autoconf automake libtool make perl unzip zip xvfb xauth dbus-x11 \
            python3 xz-utils file procps
          test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.31'
          # 同一签名快照的Clang 16必须支持固定ZXing 3.1.1使用的C++20语法。
          printf '%s\n' '#include <coroutine>' 'enum class Format { QRCode };' \
            'using enum Format;' 'static_assert(QRCode == Format::QRCode);' \
            'static_assert(sizeof(std::coroutine_handle<>) > 0);' \
            | /usr/bin/clang++-16 -std=c++20 -x c++ -fsyntax-only -
          printf '%s\n' 'CXX=/usr/bin/clang++-16' >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          targets: "${{ matrix.rust-targets }}"
          components: rust-src
      - name: Linux 编译依赖
        if: matrix.platform == 'Android'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-dev libssl-dev libglib2.0-dev libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev pkg-config cmake ninja-build autoconf automake libtool make perl unzip zip xvfb dbus-x11
      - name: 安装 Android 固定 NDK 与 CMake
        if: matrix.platform == 'Android'
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_SDK_ROOT:?Runner缺少Android SDK根}"
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          installed=0
          for attempt in 1 2 3; do
            if "$sdkmanager" "ndk;28.2.13676358" "cmake;3.31.6" \
              && test -f "$ANDROID_SDK_ROOT/ndk/28.2.13676358/source.properties" \
              && test -x "$ANDROID_SDK_ROOT/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
              && test -x "$ANDROID_SDK_ROOT/cmake/3.31.6/bin/cmake"; then
              installed=1
              break
            fi
            if (( attempt == 3 )); then
              echo "Android NDK/CMake固定包在3次尝试后仍未完整安装" >&2
              exit 1
            fi
            rm -rf -- "$ANDROID_SDK_ROOT/ndk/28.2.13676358" "$ANDROID_SDK_ROOT/.temp"
            sleep "$((attempt * 2))"
          done
          test "$installed" -eq 1
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: 准备版本化独立源码
        shell: bash
        run: node scripts/build.mjs release-source native
      - name: 安装本仓固定 Flutter
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/flutter/flutter.git "$RUNNER_TEMP/citizensdk-flutter"
          git -C "$RUNNER_TEMP/citizensdk-flutter" checkout --detach d3b14c876900e553bc736ca19295fc09e3853e8e
          if [[ "$SDK_PLATFORM" == Windows ]]; then
            # 固定提交的 Windows 包装脚本会转入 shared.bat；只在本轮副本修正上游的字面量 $git。
            CITIZENSDK_FLUTTER_ROOT="$RUNNER_TEMP/citizensdk-flutter" node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const {execFileSync} = require('node:child_process');
          const root = process.env.CITIZENSDK_FLUTTER_ROOT;
          const head = execFileSync('git', ['-C', root, 'rev-parse', 'HEAD'], {encoding:'utf8'}).trim();
          if (head !== 'd3b14c876900e553bc736ca19295fc09e3853e8e') throw Error('Windows Flutter fixed source mismatch');
          const file = path.join(root, 'bin/internal/shared.bat');
          const stat = fs.lstatSync(file);
          if (!stat.isFile() || stat.isSymbolicLink()) throw Error('Windows Flutter batch entry is not a regular file');
          const source = fs.readFileSync(file, 'utf8');
          const before = "FOR /f %%r IN ('PUSHD %FLUTTER_ROOT% ^& $git rev-parse HEAD') DO (";
          const after = "FOR /f %%r IN ('PUSHD %FLUTTER_ROOT% ^& git rev-parse HEAD') DO (";
          if (source.split(before).length !== 2) throw Error('Windows Flutter batch Git revision entry mismatch');
          fs.writeFileSync(file, source.replace(before, after));
          NODE
          fi
          echo "FLUTTER_ROOT=$RUNNER_TEMP/citizensdk-flutter" >> "$GITHUB_ENV"
          echo "CITIZENSDK_FLUTTER_ROOT=$RUNNER_TEMP/citizensdk-flutter" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/citizensdk-flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/citizensdk-flutter/bin/flutter" --version
      - name: 恢复本平台编译与依赖缓存
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: |
            ${{ runner.temp }}/citizensdk-release/cargo-home/registry
            ${{ runner.temp }}/citizensdk-release/cargo-home/git
            ${{ runner.temp }}/citizensdk-release/pub-cache/hosted
            ${{ runner.temp }}/citizensdk-release/pub-cache/git
            ${{ runner.temp }}/citizensdk-release/gradle/caches/modules-2
            ${{ runner.temp }}/citizensdk-release/gradle/caches/build-cache-1
            ${{ runner.temp }}/citizensdk-release/gradle/wrapper/dists
            ${{ runner.temp }}/citizensdk-release/work/tools/archives
            ${{ runner.temp }}/citizensdk-flutter/bin/cache/artifacts/engine
            ${{ runner.temp }}/citizensdk-flutter/bin/cache/pkg
          key: citizensdk-sdk-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-rust-1.97.1-flutter-d3b14c876900e553bc736ca19295fc09e3853e8e-${{ hashFiles('**/Cargo.lock', 'pubspec.lock', 'android/**/*.gradle', 'android/**/*.gradle.kts') }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            citizensdk-sdk-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-rust-1.97.1-flutter-d3b14c876900e553bc736ca19295fc09e3853e8e-${{ hashFiles('**/Cargo.lock', 'pubspec.lock', 'android/**/*.gradle', 'android/**/*.gradle.kts') }}-
      - name: 恢复本平台Cargo编译缓存
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/citizensdk-release/cargo-target
          key: citizensdk-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-rust-1.97.1-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            citizensdk-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-rust-1.97.1-
      - name: 准备Windows固定引擎原件
        if: matrix.platform == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          "$FLUTTER_ROOT/bin/flutter" precache --windows
          for name in flutter_sdk windows-sdk font-subset material_fonts gradle_wrapper; do
            test -s "$FLUTTER_ROOT/bin/cache/$name.stamp"
          done
      - name: 准备Android固定引擎原件
        if: matrix.platform == 'Android'
        shell: bash
        run: |
          set -euo pipefail
          "$FLUTTER_ROOT/bin/flutter" precache --android
      - name: 准备Linux固定引擎原件
        if: matrix.platform == 'LinuxARM'
        shell: bash
        run: |
          set -euo pipefail
          "$FLUTTER_ROOT/bin/flutter" precache --linux
      - name: 准备Linux锁定Pub依赖
        if: matrix.platform == 'LinuxARM'
        shell: bash
        run: |
          set -euo pipefail
          # 在本轮独立目录按产品原锁填充Pub缓存，不改写源码或消费者现场。
          seed="$(mktemp -d "$RUNNER_TEMP/citizensdk-release/pub-seed.XXXXXX")"
          trap 'rm -rf -- "$seed"' EXIT
          cp "$CITIZENSDK_SOURCE_ROOT/pubspec.yaml" "$CITIZENSDK_SOURCE_ROOT/pubspec.lock" "$seed/"
          (cd "$seed" && "$FLUTTER_ROOT/bin/flutter" pub get --enforce-lockfile)
          cmp "$CITIZENSDK_SOURCE_ROOT/pubspec.lock" "$seed/pubspec.lock"
          (cd "$seed" && "$FLUTTER_ROOT/bin/flutter" pub get --offline --enforce-lockfile)
      - name: 准备Apple固定引擎原件
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          "$FLUTTER_ROOT/bin/flutter" precache --ios --macos
      - name: 准备本仓锁定原件
        shell: bash
        run: |
          set -euo pipefail
          receipt="$(node "$CITIZENSDK_SOURCE_ROOT/scripts/build.mjs" prepare-environment --scope citizensdk --platform "$SDK_PLATFORM" --work "$CITIZENSDK_RESOURCE_WORK_DIR/tools")"
          if [[ "$SDK_PLATFORM" == Android ]]; then
            printf '%s' "$receipt" | node -e '
              let input="";process.stdin.setEncoding("utf8");process.stdin.on("data",x=>input+=x);process.stdin.on("end",()=>{
                const fs=require("node:fs"),r=JSON.parse(input),root=process.env.CITIZENSDK_RESOURCE_WORK_DIR+"/tools/";
                const gradle=r.tools?.gradle,java=r.tools?.java;
                if(r.platform!=="Android"||!gradle||!java||typeof gradle.version!=="string"||typeof java.version!=="string"
                  ||gradle.path!==root+"gradle-"+gradle.version+"/bin/gradle"||java.home!==root+"java-"+java.version
                  ||!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(gradle.version)||!/^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$/.test(java.version)
                  ||/[\r\n=]/.test(gradle.path+java.home))throw Error("Android锁定Gradle/Java准备回执无效");
                fs.accessSync(gradle.path,fs.constants.X_OK);fs.accessSync(java.home+"/bin/java",fs.constants.X_OK);
                fs.appendFileSync(process.env.GITHUB_ENV,"CITIZENSDK_GRADLE="+gradle.path+"\nJAVA_HOME="+java.home+"\n");
              });
            '
          fi
          if [[ "$SDK_PLATFORM" == LinuxARM ]]; then
            printf '%s' "$receipt" | node -e '
              let input="";process.stdin.setEncoding("utf8");process.stdin.on("data",x=>input+=x);process.stdin.on("end",()=>{
                const fs=require("node:fs"),path=require("node:path"),r=JSON.parse(input),tool=r.tools?.cmake;
                if(r.platform!==process.env.SDK_PLATFORM||tool?.version!=="3.31.6"
                  ||typeof tool.path!=="string"||!path.isAbsolute(tool.path)
                  ||!tool.path.startsWith(process.env.CITIZENSDK_RESOURCE_WORK_DIR+"/tools/cmake-3.31.6-"+r.platform+"/bin/"))
                  throw Error("Linux固定CMake准备回执无效");
                for(const name of ["cmake","ctest"])fs.accessSync(path.join(path.dirname(tool.path),name),fs.constants.X_OK);
                fs.appendFileSync(process.env.GITHUB_PATH,path.dirname(tool.path)+"\n");
              });
            '
          fi
      - name: 启用 Windows MSVC 工具
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Windows 缺少 MSVC C++ 工具' }
          Import-Module "$installation\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          foreach ($name in @('PATH','INCLUDE','LIB','LIBPATH','VCINSTALLDIR','VSINSTALLDIR','VCToolsInstallDir','WindowsSdkDir','WindowsSDKVersion')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if (-not $value -or $value.Contains("$([char]10)")) { throw "MSVC 环境无效：$name" }
            "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          foreach ($name in @('cl.exe','lib.exe','dumpbin.exe')) { Get-Command $name -ErrorAction Stop | Out-Null }
      - name: 准备 Linux 与 Windows 静态原生依赖
        if: matrix.platform == 'LinuxARM' || matrix.platform == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          result="$CITIZENSDK_RESOURCE_WORK_DIR/dependency-result.json"
          if [[ "$SDK_PLATFORM" == Windows ]]; then result="$(cygpath -u "$result")"; fi
          node "$CITIZENSDK_SOURCE_ROOT/scripts/build.mjs" prepare-native \
            --scope citizensdk --platform "$SDK_PLATFORM" --mode release \
            --sdk "$CITIZENSDK_SOURCE_ROOT" --work "$CITIZENSDK_RESOURCE_WORK_DIR/dependencies" \
            --sources "$CITIZENSDK_RESOURCE_WORK_DIR/tools" \
            --source-sha "$GITHUB_SHA" --software-version "$SOFTWARE_VERSION" > "$result"
          node scripts/build.mjs release-dependency-env
      - name: 编译本平台原生件
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SDK_PLATFORM" == LinuxARM ]]; then
            xvfb-run -a dbus-run-session -- node "$CITIZENSDK_SOURCE_ROOT/scripts/build.mjs" native "$SDK_TARGET"
          else
            node "$CITIZENSDK_SOURCE_ROOT/scripts/build.mjs" native "$SDK_TARGET"
          fi
      - name: Apple原生及Flutter绑定回归
        if: matrix.platform == 'macOS'
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        shell: bash
        run: node "$CITIZENSDK_SOURCE_ROOT/scripts/build.mjs" native apple-tests
      - name: SDK Rust与全部Dart回归
        if: matrix.platform == 'macOS'
        shell: bash
        run: node scripts/build.mjs ci-test
      - name: 保存当前 Run 原生件
        shell: bash
        run: |
          set -euo pipefail
          output="$CITIZENSDK_NATIVE_OUTPUT_DIR"
          if [[ "$SDK_PLATFORM" == Windows ]]; then output="$(cygpath -u "$output")"; fi
          case "$SDK_PLATFORM" in
            Android) paths=(android) ;;
            macOS) paths=(apple) ;;
            LinuxARM) paths=("linux/$SDK_PLATFORM" "dependencies/$SDK_PLATFORM.json") ;;
            Windows) paths=(Windows dependencies/Windows.json) ;;
            *) exit 1 ;;
          esac
          for path in "${paths[@]}"; do test -e "$output/$path"; done
          archive="$RUNNER_TEMP/公民SDK·$SDK_PLATFORM·v$SOFTWARE_VERSION.tgz"
          tar -czf "$archive" -C "$output" "${paths[@]}"
          test -s "$archive"
      - name: 保存本平台Cargo编译缓存
        if: success()
        continue-on-error: true
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/citizensdk-release/cargo-target
          key: citizensdk-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-rust-1.97.1-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "公民SDK·${{ matrix.platform }}·v${{ inputs.version }}"
          path: "${{ runner.temp }}/公民SDK·${{ matrix.platform }}·v${{ inputs.version }}.tgz"
          if-no-files-found: error
          retention-days: 7
      - name: 清理Android本轮构建目录
        if: always() && matrix.platform == 'Android'
        shell: bash
        run: node scripts/build.mjs release-cleanup-android-work
  native-linux:
    name: "公民SDK·${{ matrix.platform }}·v${{ inputs.version }}"
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: LinuxARM, target: LinuxARM, runner: ubuntu-24.04-arm, rust-targets: aarch64-unknown-linux-gnu}
    runs-on: "${{ matrix.runner }}"
    container:
      image: debian:bullseye@sha256:6f519a81440354a85eb592c5f32109ab80605f6b892455983a6f618bf87fabe9
    timeout-minutes: 180
    env:
      GH_TOKEN: "${{ github.token }}"
      CARGO_INCREMENTAL: '1'
      SOFTWARE_VERSION: "${{ needs.prepare.outputs.version }}"
      SDK_PLATFORM: "${{ matrix.platform }}"
      SDK_TARGET: "${{ matrix.target }}"
    steps: *native_steps
  assemble:
    name: "公民SDK·SDK·v${{ inputs.version }}"
    needs: [prepare, native, native-linux]
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      SOFTWARE_VERSION: "${{ needs.prepare.outputs.version }}"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: "公民SDK·*·v${{ inputs.version }}"
          path: "${{ runner.temp }}/native-artifacts"
          merge-multiple: false
      - name: 汇总同一源码的四平台原生件并构造正式包
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/citizensdk-native"
          for platform in Android macOS LinuxARM Windows; do
            archive="$RUNNER_TEMP/native-artifacts/公民SDK·$platform·v$SOFTWARE_VERSION/公民SDK·$platform·v$SOFTWARE_VERSION.tgz"
            test -s "$archive"
            tar -xzf "$archive" -C "$RUNNER_TEMP/citizensdk-native"
          done
          mkdir -p "$RUNNER_TEMP/citizensdk-transfer/release" "$RUNNER_TEMP/citizensdk-transfer/candidate"
          node scripts/build.mjs release-source assemble
          node scripts/build.mjs release-build \
            --source "$RUNNER_TEMP/citizensdk-source" \
            --native "$RUNNER_TEMP/citizensdk-native" \
            --output "$RUNNER_TEMP/citizensdk-candidate" \
            --archive "$RUNNER_TEMP/citizensdk-transfer/release/公民SDK·SDK·v$SOFTWARE_VERSION.tgz" \
            --git-sha "$GITHUB_SHA" --software-version "$SOFTWARE_VERSION"
          node scripts/build.mjs release-verify --verify "$RUNNER_TEMP/citizensdk-candidate" \
            --archive "$RUNNER_TEMP/citizensdk-transfer/release/公民SDK·SDK·v$SOFTWARE_VERSION.tgz" --expected-git-sha "$GITHUB_SHA"
          test -s "$RUNNER_TEMP/citizensdk-transfer/release/公民SDK·SDK·v$SOFTWARE_VERSION.tgz"
          tar -czf "$RUNNER_TEMP/citizensdk-transfer/candidate/公民SDK·SDK·v$SOFTWARE_VERSION.tgz" -C "$RUNNER_TEMP/citizensdk-candidate" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "公民SDK·SDK·v${{ inputs.version }}"
          path: "${{ runner.temp }}/citizensdk-transfer/"
          if-no-files-found: error
          retention-days: 7
  consume:
    name: "公民SDK·${{ matrix.platform }}·v${{ inputs.version }}"
    needs: [prepare, assemble]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: Android, runner: ubuntu-24.04}
          - {platform: macOS, runner: xcode-27}
          - {platform: LinuxARM, runner: ubuntu-24.04-arm}
          - {platform: Windows, runner: windows-2025}
    runs-on: "${{ matrix.runner }}"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: "公民SDK·SDK·v${{ inputs.version }}"
          path: "${{ runner.temp }}/citizensdk-transfer"
      - name: 本平台复验同一正式候选
        env:
          SOFTWARE_VERSION: "${{ needs.prepare.outputs.version }}"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/citizensdk-candidate"
          tar -xzf "$RUNNER_TEMP/citizensdk-transfer/candidate/公民SDK·SDK·v$SOFTWARE_VERSION.tgz" -C "$RUNNER_TEMP/citizensdk-candidate"
          node scripts/build.mjs release-verify --verify "$RUNNER_TEMP/citizensdk-candidate" \
            --archive "$RUNNER_TEMP/citizensdk-transfer/release/公民SDK·SDK·v$SOFTWARE_VERSION.tgz" \
            --expected-git-sha "$GITHUB_SHA"
  release:
    name: "公民SDK·SDK·v${{ inputs.version }}"
    needs: [prepare, native, native-linux, assemble, consume, cargo-retention]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: "${{ github.token }}"
      RELEASE_TAG: "${{ needs.prepare.outputs.tag }}"
      RELEASE_VERSION: "${{ needs.prepare.outputs.version }}"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: "公民SDK·SDK·v${{ inputs.version }}"
          path: "${{ runner.temp }}/citizensdk-transfer"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - name: 创建并逐件回读唯一正式 SDK Release
        shell: bash
        run: node scripts/build.mjs release-github
  cargo-retention:
    name: "公民SDK·${{ matrix.platform }}·v${{ inputs.version }}"
    needs: [native, native-linux]
    if: always() && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: Android, cache-os: Linux, cache-arch: X64}
          - {platform: macOS, cache-os: macOS, cache-arch: ARM64}
          - {platform: LinuxARM, cache-os: Linux, cache-arch: ARM64}
          - {platform: Windows, cache-os: Windows, cache-arch: X64}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: "${{ github.token }}"
      SDK_PLATFORM: "${{ matrix.platform }}"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - name: 每个平台只保留最新增量缓存
        env:
          CARGO_CACHE_KEY: citizensdk-cargo-v1-${{ matrix.cache-os }}-${{ matrix.cache-arch }}-${{ matrix.platform }}-rust-1.97.1-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          SDK_DEPS_CACHE_KEY: citizensdk-sdk-deps-v2-${{ matrix.cache-os }}-${{ matrix.cache-arch }}-${{ matrix.platform }}-rust-1.97.1-flutter-d3b14c876900e553bc736ca19295fc09e3853e8e-${{ hashFiles('**/Cargo.lock', 'pubspec.lock', 'android/**/*.gradle', 'android/**/*.gradle.kts') }}-run-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: node scripts/build.mjs release-cache-prune
  run-retention:
    name: "公民SDK·SDK·v${{ inputs.version }}"
    needs: [prepare, native, native-linux, assemble, consume, release, cargo-retention]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: "${{ github.token }}"
      SDK_FINAL_OUTCOME: "${{ needs.prepare.result == 'success' && needs.native.result == 'success' && needs.native-linux.result == 'success' && needs.assemble.result == 'success' && needs.consume.result == 'success' && needs.release.result == 'success' && needs.cargo-retention.result == 'success' && 'success' || 'failure' }}"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - name: 仅保留本工作流最新成功与失败Run
        shell: bash
        run: node scripts/build.mjs release-run-prune "$SDK_FINAL_OUTCOME"
