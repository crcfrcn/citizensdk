    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: tools
        name: 从本产品声明读取Node版本
        shell: bash
        run: |
