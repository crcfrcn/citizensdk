          node_version="$(sed -n "s/.*node:'\([^']*\)'.*/\1/p" scripts/config.mjs)"
          [[ "$node_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'node=%s\n' "$node_version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ steps.bootstrap.outputs.node }}
      - name: 发布前核对来源Run和Artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build.mjs source "$SOURCE_RUN" > "$RUNNER_TEMP/source.json"
          jq -e --argjson run "$SOURCE_RUN" --argjson attempt "$SOURCE_ATTEMPT" --argjson artifact "$SOURCE_ARTIFACT" --arg sha "$SOURCE_SHA" --arg version "$SDK_VERSION" '.sourceRun==$run and .sourceAttempt==$attempt and .artifactID==$artifact and .sourceSha==$sha and .version==$version' "$RUNNER_TEMP/source.json" >/dev/null
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ inputs.source_artifact }}
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/publication
      - name: 仅发布已验证原产物
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_ARTIFACT_DIRECTORY: ${{ runner.temp }}/publication
        shell: bash
        run: |
          set -euo pipefail
          name="公民SDK·SDK·v$SDK_VERSION"
          export SDK_NAME="$name"
          notes="$RUNNER_TEMP/publication.json"
          node scripts/build.mjs verify-publication "$SDK_ARTIFACT_DIRECTORY" > "$notes"
          encoded="$(jq -rn --arg name "$name" '$name|@uri')"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          jq --arg name "$name" '[.[][]|select(.tag_name==$name)]' "$RUNNER_TEMP/releases.json" > "$RUNNER_TEMP/existing.json"
          count="$(jq length "$RUNNER_TEMP/existing.json")"
          [[ "$count" -le 1 ]]
          draft=true
          if [ "$count" -eq 1 ]; then
            jq -e --slurpfile expected "$notes" '.[0].body|fromjson|.product_id==$expected[0].product_id and .platform==$expected[0].platform and .software_version==$expected[0].software_version and .git_commit_sha==$expected[0].git_commit_sha and .producer_run_id==$expected[0].producer_run_id and .producer_run_attempt==$expected[0].producer_run_attempt and .assets==$expected[0].assets' "$RUNNER_TEMP/existing.json" >/dev/null
            old_run="$(jq -er '.[0].body|fromjson|.publication_run_id' "$RUNNER_TEMP/existing.json")"
            old_attempt="$(jq -er '.[0].body|fromjson|.publication_run_attempt' "$RUNNER_TEMP/existing.json")"
            [[ "$old_run" =~ ^[1-9][0-9]*$ && "$old_attempt" =~ ^[1-9][0-9]*$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$old_run/attempts/$old_attempt" | jq -e --arg sha "$SOURCE_SHA" '.status=="completed" and .conclusion!="success" and .head_sha==$sha and .head_branch=="main" and .path==".github/workflows/sdk.yml" and .event=="workflow_dispatch"' >/dev/null
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$encoded" | jq -e --arg sha "$SOURCE_SHA" '.object.type=="commit" and .object.sha==$sha' >/dev/null
            draft="$(jq -r '.[0].draft' "$RUNNER_TEMP/existing.json")"
            if [ "$draft" = true ]; then
              jq -e --arg name "$name" 'all(.[0].assets[]; .label==($name+".zip") or .label==($name+".json") or .label==($name+".sha256"))' "$RUNNER_TEMP/existing.json" >/dev/null
              gh release edit "$name" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
              files=(); for file in "$SDK_ARTIFACT_DIRECTORY/"*; do files+=("$file#$(basename "$file")"); done
              gh release upload "$name" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            fi
          else
            # 保留未确认状态供下一次明确授权核验；不自动回滚或删除正式发布。
            ref="$(gh api graphql -f query='query($owner:String!,$repo:String!,$tag:String!){repository(owner:$owner,name:$repo){ref(qualifiedName:$tag){target{oid}}}}' -f owner="$GITHUB_REPOSITORY_OWNER" -f repo="${GITHUB_REPOSITORY#*/}" -f tag="refs/tags/$name" --jq '.data.repository.ref.target.oid // ""')"
            test -z "$ref"
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$name" -f sha="$SOURCE_SHA" > "$RUNNER_TEMP/tag.json"
            jq -e --arg sha "$SOURCE_SHA" '.object.type=="commit" and .object.sha==$sha' "$RUNNER_TEMP/tag.json" >/dev/null
            files=(); for file in "$SDK_ARTIFACT_DIRECTORY/"*; do files+=("$file#$(basename "$file")"); done
            gh release create "$name" "${files[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --target "$SOURCE_SHA" --title "$name" --notes-file "$notes" --draft
          fi
          back="$RUNNER_TEMP/readback"
          mkdir "$back"
          gh release view "$name" --repo "$GITHUB_REPOSITORY" --json assets > "$RUNNER_TEMP/assets.json"
          jq -e '.assets|length==3' "$RUNNER_TEMP/assets.json" >/dev/null
          for file in "$SDK_ARTIFACT_DIRECTORY/"*; do
            label="$(basename "$file")"
            remote="$(jq -er --arg label "$label" '[.assets[]|select(.label==$label and .state=="uploaded")]|if length==1 then .[0].name else error("SDK附件不唯一") end' "$RUNNER_TEMP/assets.json")"
            gh release download "$name" --repo "$GITHUB_REPOSITORY" --pattern "$remote" --output "$back/$label"
            cmp "$file" "$back/$label"
          done
          if [ "$draft" = true ]; then gh release edit "$name" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest; fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$encoded" > "$RUNNER_TEMP/published.json"
          jq -e --arg name "$name" --arg sha "$SOURCE_SHA" '.draft==false and .prerelease==false and .published_at!=null and .name==$name and .tag_name==$name and .target_commitish==$sha and (.assets|length)==3' "$RUNNER_TEMP/published.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$encoded" | jq -e --arg sha "$SOURCE_SHA" '.object.type=="commit" and .object.sha==$sha' >/dev/null
          release_id="$(jq -er .id "$RUNNER_TEMP/published.json")"
          node scripts/build.mjs cleanup-publications "$release_id"
