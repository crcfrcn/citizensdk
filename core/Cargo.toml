[package]
name = "citizen-sdk-engine"
description = "CitizenSDK product-independent account, runtime, transaction, and state coordination engine."
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[features]
default = ["wallet", "signing", "chain", "transactions", "history", "qr"]
# 钱包派生需要密码学实现，但实例的公开签名授权仍由独立 modules 位控制。
wallet = ["signing"]
signing = []
chain = ["dep:subxt-core"]
transactions = ["chain"]
history = ["chain"]
qr = ["dep:citizen-sdk-qr"]

[dependencies]
# `Mnemonic` 内部同样等价持有助记词索引；必须启用上游析构清零，不能只清理外围 String。
bip39 = { version = "=2.2.2", default-features = false, features = ["std", "zeroize"] }
citizen-sdk-contracts = { path = "../types" }
citizen-sdk-qr = { path = "../qr", optional = true }
getrandom = "=0.3.4"
hmac = "=0.12.1"
pbkdf2 = "=0.12.2"
futures = "=0.3.34"
sha2 = "=0.10.9"
# Keep the same official crates.io Subxt core used by CitizenChain's verified
# client tooling. This crate decodes metadata and System.Events only; it does
# not add an online RPC client or a second light-node implementation.
subxt-core = { version = "=0.43.0", default-features = true, optional = true }
unicode-normalization = "=0.1.25"
unicode-segmentation = "=1.13.3"
zeroize = "=1.9.0"

[dev-dependencies]
citizen-signer = { path = "../sign" }
serde_json = "=1.0.151"

# 公开合同测试显式登记；其余tests文件由原模块按cfg(test)加载。

[[test]]
name = "account_state"
path = "tests/account_state.rs"

[[test]]
name = "baseline_resource_contract"
path = "tests/baseline_resource_contract.rs"

[[test]]
name = "capabilities"
path = "tests/capabilities.rs"

[[test]]
name = "chain_access"
path = "tests/chain_access.rs"

[[test]]
name = "engine_boundary"
path = "tests/engine_boundary.rs"

[[test]]
name = "runtime_context"
path = "tests/runtime_context.rs"

[[test]]
name = "state_import"
path = "tests/state_import.rs"

[[test]]
name = "transaction_outcome"
path = "tests/transaction_outcome.rs"
