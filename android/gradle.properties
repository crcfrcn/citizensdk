# CitizenSDK Android bindings use AndroidX APIs (Biometric, Fragment, Core).
# Keep this project-local so native AAR builds and Flutter projections agree.
android.useAndroidX=true
# CitizenSDK与所有宿主共用唯一AGP 9新DSL及内置Kotlin合同。
android.builtInKotlin=true
android.newDsl=true
# Keep CitizenSDK compiler state inside the explicitly externalized Gradle
# build/cache roots; do not create a user-level Kotlin daemon record.
kotlin.compiler.execution.strategy=in-process
