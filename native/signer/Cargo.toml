[package]
name = "citizen-signer"
description = "CitizenSDK 唯一 sr25519 实现：ChainSigner 与 legacy FFI 共用同一 schnorrkel 真源。"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# CitizenSDK 内单一真源：新 ChainSigner 与 SDK legacy libsmoldot 投影都静态链接本
# crate。尚未切换 SDK 的应用继续使用 shared/citizen-signer，本 crate 不反向 path 依赖。
[lib]
# rlib：供两端的 cdylib 静态链接。FFI 外壳由 `export_citizen_signer_ffi!()` 宏在
# 各端 cdylib 内就地生成，符号必被导出；符号检查（注意平台差异，用错标志会误判为 0）：
#   Android/ELF   llvm-nm -D <lib>.so    | grep -c citizen_sr25519  应为 4
#   macOS/Mach-O  llvm-nm -g <lib>.dylib | grep -c citizen_sr25519  应为 4
crate-type = ["rlib"]

[dependencies]
# 唯一真实实现直接履行产品无关 ChainSigner/SecretBuffer 合同；硬件金库仍是独立合同。
citizen-sdk-contracts = { path = "../contracts" }
# 版本与 citizenapp/smoldot/pow/lib 保持一致，全仓单一 sr25519 实现。
schnorrkel = { version = "=0.11.5", default-features = false, features = [
    "preaudit_deprecated",
    "alloc",
    "getrandom",
] }
# 私钥材料作用域结束即擦除，禁止手写清零（会被编译器优化掉）。
zeroize = "=1.9.0"
