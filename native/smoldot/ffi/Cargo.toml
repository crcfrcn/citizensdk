[workspace]

[package]
name = "smoldot_ffi"
version = "1.0.0"
edition = "2021"
authors = ["VoyagerRhett"]
license = "Apache-2.0"
description = "FFI bindings for smoldot-light"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "smoldot"

[dependencies]
# 归档差分适配仍属第一方；直接依赖与正式适配共用准确版本，不改变上游PoW闭包。
# 固定引用仓库内收编的 PoW 轻节点快照，禁止再回指根目录临时 smoldot。
smoldot-light = { path = "../pow/light-base" }
tokio = { version = "=1.53.1", features = ["full"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
futures = "=0.3.34"
parking_lot = "=0.12.5"
once_cell = "1.19"
libc = "0.2"
log = "=0.4.34"
env_logger = "0.11"
blake2-rfc = "=0.2.18"
hex = "=0.4.3"
# sr25519 原生签名只依赖 CitizenSDK 内部唯一实现，Release/CI 禁止回指其他产品。
citizen-signer = { path = "../../signer" }

[target.'cfg(target_os = "android")'.dependencies]
# 归档模块仍统一使用 SDK 已锁定的 JNI 版本，避免同名直接依赖分叉。
jni = "=0.22.4"
android_logger = "0.14"

[profile.release]
opt-level = "z"        # Optimize for size
lto = true             # Link-time optimization
codegen-units = 1      # Better optimization
# 磁盘产物始终保留符号+行号,原生崩溃栈才能反解到 Rust 源码行(留档即符号服务器)。
# 最终宿主 APK 由宿主 AGP 配置分档处理:debug 包保留、release 包打包时剥离；
# CitizenSDK 正式临时宿主的约束见本仓 scripts 中的独立 CI、Release。
strip = false
debug = 1
# 必须 unwind:citizen-signer 的 4 个 FFI 入口靠 `catch_unwind` 把内部 panic 兜成
# 错误码;`panic = "abort"` 下 catch_unwind 形同虚设,panic 直接 abort 掉 App,
# 「绝不 abort」的安全承诺就是假的。未包 catch_unwind 的 smoldot_* 入口不受影响:
# Rust 对 `extern "C"` 边界自带 abort-on-unwind 兜底,行为与之前一致。
panic = "unwind"

[profile.dev]
opt-level = 1          # Faster compilation in dev

[build-dependencies]
cbindgen = "0.27"
