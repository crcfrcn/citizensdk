[package]
name = "citizen-sdk-contracts"
description = "CitizenSDK Core 的类型化链、签名、金库、钱包与状态存储合同。"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[dependencies]
# 钱包公开 profile 必须按 CitizenChain SS58 prefix 反证规范地址，不能只接受任意展示字符串。
blake2 = "=0.10.6"
bs58 = { version = "=0.5.1", default-features = false, features = ["alloc"] }
# watch_extrinsic 只暴露标准 Stream 语义，不把具体异步运行时带入合同层。
futures-core = "=0.3.34"
# SecretBuffer 的实际内存擦除由成熟实现负责，禁止以普通 Vec 模拟清零。
zeroize = "=1.9.0"

# 公开合同测试显式登记；其余tests文件由原模块按cfg(test)加载。

[[test]]
name = "account_contract"
path = "tests/account_contract.rs"

[[test]]
name = "capability_contract"
path = "tests/capability_contract.rs"

[[test]]
name = "chain_contract"
path = "tests/chain_contract.rs"

[[test]]
name = "secret_contract"
path = "tests/secret_contract.rs"

[[test]]
name = "state_store_contract"
path = "tests/state_store_contract.rs"

[[test]]
name = "transaction_build_contract"
path = "tests/transaction_build_contract.rs"

[[test]]
name = "transaction_history_contract"
path = "tests/transaction_history_contract.rs"

[[test]]
name = "transaction_prepare_contract"
path = "tests/transaction_prepare_contract.rs"
