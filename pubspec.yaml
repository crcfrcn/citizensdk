name: citizen_sdk
description: Citizenchain light client, rootless hot wallet, sr25519 signing, and on-chain transaction SDK.
version: 1.0.0
repository: https://github.com/crcfrcn/citizensdk

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  polkadart_keyring: 0.7.1

dev_dependencies:
  # 正式 Binding 与链资产回归；旧 Dart 轻节点差分链不再参与 SDK 构建。
  crypto: 3.0.7
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: org.citizen.sdk
        pluginClass: CitizenSdkPlugin
      ios:
        pluginClass: CitizenSdkPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: CitizenSdkPlugin
        sharedDarwinSource: true
      # LinuxARM 使用 Flutter 官方 linux 注册和同版 Host/Core，x64 构建被插件拒绝。
      linux:
        pluginClass: CitizenSdkPlugin
      windows:
        pluginClass: CitizenSdkPlugin
  assets:
    - chain/
