name: citizen_sdk
description: Citizenchain light client, rootless hot wallet, sr25519 signing, and on-chain transaction SDK.
version: 1.0.0
repository: https://github.com/crcfrcn/citizensdk

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  ffi: 2.2.0
  flutter:
    sdk: flutter
  # 地址仅消费原锁中的SS58实现，不引入签名和助记词依赖。
  ss58: 1.3.1

dev_dependencies:
  ffigen: 20.1.1
  # 正式 Binding 与链资产回归；旧 Dart 轻节点差分链不再参与 SDK 构建。
  crypto: 3.0.7
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: org.citizen.sdk
        pluginClass: CitizenSdkPlugin
      ios:
        pluginClass: CitizenSdkPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: CitizenSdkPlugin
        sharedDarwinSource: true
      # LinuxARM 使用 Flutter 官方 linux 注册和同版 Host/Core，x64 构建被插件拒绝。
      linux:
        pluginClass: CitizenSdkPlugin
      windows:
        pluginClass: CitizenSdkPlugin
  assets:
    - chain/

# 生成配置唯一归本声明；运行dart run ffigen。
ffigen:
  name: Bindings
  description: '由公民SDK公开C头生成；禁止手工维护签名。'
  output: lib/platform/bind.dart
  headers:
    entry-points:
      - include/citizensdk.h
      - image/citizensdk_qr_image.h
    include-directives:
      - '**citizensdk.h'
      - '**citizensdk_types.h'
      - '**citizensdk_qr_image.h'
  functions:
    symbol-address:
      include:
        - citizensdk_dart_emit
    include:
      - 'citizensdk_.*'
  structs:
    rename:
      '_Dart_CObject': DartObject
    include:
      - 'citizensdk_.*'
  enums:
    include:
      - 'citizensdk_.*'
  compiler-opts:
    - '-Iinclude'
    - '-DCITIZENSDK_DART=1'
